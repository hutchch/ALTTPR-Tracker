<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Randomizer Tracker</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  max-width: 420px; margin: 10px auto; padding: 10px;
  background: #0d0d0d; color: #ccc;
}
h1 { text-align: center; color: #4dff88; font-size: 22px; margin-bottom: 24px; letter-spacing: 1px; }
.section {
  background: #1a1a1a; border: 1px solid #2a2a2a;
  border-radius: 6px; padding: 10px; margin-bottom: 8px;
}
.section h2 { margin: 0 0 12px; color: #7ab8f5; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.row label { color: #666; font-size: 12px; min-width: 80px; }
input, select {
  background: #111; color: #ccc; border: 1px solid #333;
  border-radius: 4px; padding: 5px 8px; font-size: 12px; flex: 1;
}
input:focus, select:focus { outline: none; border-color: #4dff88; }
.info { color: #444; font-size: 10px; margin-top: 2px; padding-left: 90px; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.launch-btn {
  flex: 1; padding: 12px;
  font-size: 14px; font-weight: bold; cursor: pointer;
  border: none; border-radius: 6px; transition: background 0.2s;
}
#btn-items { background: #1a4a2a; color: #4dff88; border: 1px solid #2a7a3a; }
#btn-items:hover { background: #2a6a3a; }
#btn-map   { background: #1a2e4a; color: #7ab8f5; border: 1px solid #2a4e7a; }
#btn-map:hover   { background: #2a4a6a; }
#btn-both  { background: #3a2a00; color: #ffd700; border: 1px solid #7a5a00; }
#btn-both:hover  { background: #5a4000; }
#btn-timer { background: #2a0a3a; color: #c084fc; border: 1px solid #6a2a9a; }
#btn-timer:hover { background: #4a1a6a; }
.divider { border: none; border-top: 1px solid #222; margin: 4px 0 12px; }

/* ── Settings gear button ── */
#app-settings-btn {
  position: fixed; top: 10px; right: 10px;
  background: #1a1a1a; border: 1px solid #333; color: #666;
  border-radius: 50%; width: 28px; height: 28px;
  font-size: 15px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: color 0.15s, border-color 0.15s;
  z-index: 100;
}
#app-settings-btn:hover { color: #aaa; border-color: #555; }

/* ── App settings panel ── */
#app-settings-panel {
  display: none;
  position: fixed; top: 44px; right: 10px;
  background: #1a1a1a; border: 1px solid #333;
  border-radius: 6px; padding: 12px 14px;
  min-width: 220px; z-index: 99;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
}
#app-settings-panel.open { display: block; }
#app-settings-panel h4 {
  margin: 0 0 10px; font-size: 11px; color: #555;
  text-transform: uppercase; letter-spacing: 1px;
}
.app-settings-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; font-size: 12px; color: #999;
}
#check-update-btn {
  flex: 1; padding: 6px 10px; font-size: 12px; cursor: pointer;
  background: #1a2e4a; color: #7ab8f5;
  border: 1px solid #2a4e7a; border-radius: 4px;
  transition: background 0.15s;
}
#check-update-btn:hover { background: #2a4a6a; }
#check-update-btn:disabled { opacity: 0.5; cursor: default; }
#update-panel-status {
  font-size: 10px; color: #666; margin-top: 2px;
}

/* ── Update notification bar ── */
#update-bar {
  display: none;
  background: #1a2e1a; border: 1px solid #2a5a2a;
  border-radius: 4px; padding: 7px 10px;
  margin-bottom: 10px;
  font-size: 12px; color: #4dff88;
  align-items: center; gap: 8px;
}
#update-bar.visible { display: flex; }
#update-bar.error   { background: #2e1a1a; border-color: #5a2a2a; color: #ff7777; }
#install-update-btn {
  margin-left: auto; padding: 4px 10px;
  background: #2a5a2a; color: #4dff88;
  border: 1px solid #4dff88; border-radius: 4px;
  font-size: 11px; cursor: pointer; white-space: nowrap;
}
#install-update-btn:hover { background: #3a7a3a; }
</style>
</head>
<body>

<!-- Settings gear -->
<button id="app-settings-btn" title="App Settings" onclick="toggleAppSettings()">⚙</button>

<!-- App settings panel -->
<div id="app-settings-panel">
  <h4>App Settings</h4>
  <div class="app-settings-row">
    <button id="check-update-btn" onclick="manualCheckUpdate()">Check for Updates</button>
  </div>
  <div id="update-panel-status"></div>
</div>

<!-- Update notification bar (shown when update available/ready) -->
<div id="update-bar">
  <span id="update-bar-msg">Checking for updates…</span>
</div>

<h1>⚔ ALTTP Tracker</h1>
  <p style="text-align: center;">
  <small>Version 1.1.13 </small>
</p>
<div class="section">
  <h2>Connection</h2>
  <div class="row">
    <label>Host</label>
    <input id="ws-host" type="text" value="localhost" placeholder="localhost">
  </div>
  <div class="row">
    <label>Port</label>
    <input id="ws-port" type="text" value="23074" placeholder="23074">
  </div>
  <div class="info">QUSB2SNES / SNI — default port 23074</div>
</div>

<div class="section">
  <h2>Display</h2>
  <div class="row">
    <label>Item Scale</label>
    <select id="item-scale">
      <option value="0.7">70%</option>
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="1.0" selected>100%</option>
      <option value="1.1">110%</option>
      <option value="1.2">120%</option>
      <option value="1.3">130%</option>
      <option value="1.4">140%</option>
      <option value="1.5">150%</option>
      <option value="1.6">160%</option>
      <option value="1.7">170%</option>
    </select>
  </div>
  <div class="row">
    <label>Tracker BG</label>
    <select id="tracker-bg">
      <option value="black"       selected>Black</option>
      <option value="grey"               >Grey</option>
      <option value="white"              >White</option>
      <option value="transparent"        >Transparent</option>
    </select>
  </div>
  <div class="row">
    <label>Map Scale</label>
    <select id="map-zoom">
      <option value="70">70%</option>
      <option value="75">75%</option>
      <option value="80">80%</option>
      <option value="85">85%</option>
      <option value="90">90%</option>
      <option value="95">95%</option>
      <option value="100" selected>100%</option>
      <option value="105">105%</option>
      <option value="110">110%</option>
      <option value="115">115%</option>
      <option value="120">120%</option>
      <option value="125">125%</option>
      <option value="130">130%</option>
      <option value="135">135%</option>
      <option value="140">140%</option>
      <option value="145">145%</option>
      <option value="150">150%</option>
    </select>
  </div>
</div>

<div class="section">
  <h2>Settings</h2>
  <div class="row">
    <label>Dungeon Item Shuffle</label>
    <select id="dungeonitems-select" style="flex:1;">
      <option value="standard">Standard</option>
      <option value="mapcompass">Map/Compass</option>
      <option value="mapcompasskeys">Map/Compass/Small Keys</option>
      <option value="keysanity">Key Sanity</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div class="row">
    <label>Ganon's Tower Requirement</label>
    <select id="gt-crystals">
      <option value="7" selected>7</option>
      <option value="6">6</option>
      <option value="5">5</option>
      <option value="4">4</option>
      <option value="3">3</option>
      <option value="2">2</option>
      <option value="1">1</option>
    </select>
  </div>
  <div class="row">
    <label>World State Mode</label>
    <select id="gamemode-select">
      <option value="standard" selected>Standard</option>
      <option value="open">Open</option>
      <option value="inverted">Inverted</option>
    </select>
  </div>
  <div class="row">
    <label>Boss Shuffle</label>
    <div style="display:flex;gap:16px;align-items:center;">
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="bossshuffle" id="bossshuffle-yes" value="yes" checked> Yes
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="bossshuffle" id="bossshuffle-no" value="no"> No
      </label>
    </div>
  </div>
  <div class="row">
    <label>Enemizer</label>
    <div style="display:flex;gap:16px;align-items:center;">
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="enemizer" id="enemizer-yes" value="yes" checked> Yes
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="enemizer" id="enemizer-no" value="no"> No
      </label>
    </div>
  </div>
  <div class="row">
    <label>Swordless</label>
    <div style="display:flex;gap:16px;align-items:center;">
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="swordless" id="swordless-no" value="no" checked> No
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="swordless" id="swordless-yes" value="yes"> Yes
      </label>
    </div>
  </div>
</div>

<div class="btn-row">
  <button class="launch-btn" id="btn-items" onclick="launchItems()">Items Only</button>
  <button class="launch-btn" id="btn-map"   onclick="launchMap()">Map Only</button>
  <button class="launch-btn" id="btn-both"  onclick="launchBoth()">Launch Both</button>
</div>

<div class="section" style="margin-top:8px;">
  <h2>Timer</h2>
  <div class="row">
    <label>Number Color</label>
    <select id="timer-color" style="flex:1;">
      <option value="blue"   selected>Blue</option>
      <option value="green"         >Green</option>
      <option value="red"           >Red</option>
      <option value="orange"        >Orange</option>
      <option value="purple"        >Purple</option>
      <option value="yellow"        >Yellow</option>
      <option value="pink"          >Pink</option>
      <option value="custom"        >Custom</option>
    </select>
    <input type="color" id="timer-color-custom" value="#3498db"
           title="Used when Number Color is set to Custom"
           style="flex:0 0 auto;width:32px;height:24px;padding:0;border:1px solid #333;background:transparent;cursor:pointer;">
  </div>
  <div class="row">
    <label>Background</label>
    <select id="timer-bg" style="flex:1;">
      <option value="black"       selected>Black</option>
      <option value="grey"               >Grey</option>
      <option value="white"              >White</option>
      <option value="transparent"        >Transparent</option>
      <option value="custom"             >Custom</option>
    </select>
    <input type="color" id="timer-bg-custom" value="#222222"
           title="Used when Background is set to Custom"
           style="flex:0 0 auto;width:32px;height:24px;padding:0;border:1px solid #333;background:transparent;cursor:pointer;">
  </div>
  <div class="btn-row" style="margin-top:8px;">
    <button class="launch-btn" id="btn-timer" onclick="launchTimer()">⏱ Automatic Timer</button>
  </div>
  <div class="info" style="padding-left:15px;margin-top:6px;color:#8353d5;font-style:italic;;">⚠ Pause will only work while the game is in a menu. (See User Guide)</div>
</div>


<script>
var IS_ELECTRON = !!(window.electronAPI && window.electronAPI.isElectron);

function getSettings() {
  return {
    wsHost:     document.getElementById('ws-host').value     || 'localhost',
    wsPort:     document.getElementById('ws-port').value     || '23074',
    scale:      document.getElementById('item-scale').value  || '1.0',
    zoom:       document.getElementById('map-zoom').value    || '100',
    layout:     localStorage.getItem('alttp-map-layout')     || 'horizontal',
    enemizer:   document.querySelector('input[name="enemizer"]:checked').value || 'yes',
    bossshuffle: document.querySelector('input[name="bossshuffle"]:checked') ? document.querySelector('input[name="bossshuffle"]:checked').value : 'yes',
    gtCrystals: document.getElementById('gt-crystals').value || '7',
    gamemode:      document.getElementById('gamemode-select') ? document.getElementById('gamemode-select').value : 'standard',
    dungeonItems:  document.getElementById('dungeonitems-select') ? document.getElementById('dungeonitems-select').value : 'standard',
    trackerBg:  document.getElementById('tracker-bg') ? document.getElementById('tracker-bg').value : 'black',
    swordless:  document.querySelector('input[name="swordless"]:checked') ? document.querySelector('input[name="swordless"]:checked').value : 'no',
  };
}

function save() {
  var s = getSettings();
  localStorage.setItem('alttp-ws-host',     s.wsHost);
  localStorage.setItem('alttp-ws-port',     s.wsPort);
  localStorage.setItem('alttp-item-scale',  s.scale);
  localStorage.setItem('alttp-map-zoom',    s.zoom);
  localStorage.setItem('alttp-enemizer',    s.enemizer);
  localStorage.setItem('alttp-bossshuffle', s.bossshuffle);
  localStorage.setItem('alttp-gt-crystals', s.gtCrystals);
  localStorage.setItem('alttp-gamemode', s.gamemode);
  localStorage.setItem('alttp-dungeon-items', s.dungeonItems);
  localStorage.setItem('alttp-tracker-bg', document.getElementById('tracker-bg') ? document.getElementById('tracker-bg').value : 'black');
  localStorage.setItem('alttp-timer-color', document.getElementById('timer-color') ? document.getElementById('timer-color').value : 'blue');
  localStorage.setItem('alttp-timer-bg', document.getElementById('timer-bg') ? document.getElementById('timer-bg').value : 'black');
  if (document.getElementById('timer-color-custom')) localStorage.setItem('alttp-timer-color-custom', document.getElementById('timer-color-custom').value);
  if (document.getElementById('timer-bg-custom'))    localStorage.setItem('alttp-timer-bg-custom',    document.getElementById('timer-bg-custom').value);
  var sw = document.querySelector('input[name="swordless"]:checked'); if (sw) localStorage.setItem('alttp-swordless', sw.value);
}

function mapUrl(s) {
  return 'map.html?zoom=' + s.zoom + '&enemizer=' + s.enemizer + '&gtcrystals=' + s.gtCrystals + '&gamemode=' + s.gamemode + '&dungeonitems=' + s.dungeonItems + '&swordless=' + s.swordless + '&bossshuffle=' + s.bossshuffle;
}

function launchItems() {
  save();
  var s = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'items', ...s });
  } else {
    var tbg = document.getElementById('tracker-bg') ? document.getElementById('tracker-bg').value : 'black';
    var di = s.dungeonItems || 'standard';
    window.open('itemtracker.html?scale=' + s.scale + '&bg=' + tbg + '&dungeonitems=' + di + '&bossshuffle=' + s.bossshuffle, 'alttp-items', 'width=500,height=390,resizable=yes');
  }
}

function launchMap() {
  save();
  var s    = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'map', ...s });
  } else {
    var size = Math.round(512 * parseInt(s.zoom) / 100);
    var w = s.layout === 'vertical' ? size + 20 : size * 2 + 32;
    var h = size + 92;
    window.open(mapUrl(s), 'alttp-map', 'width=' + w + ',height=' + h + ',resizable=yes');
  }
}

function launchTimer() {
  save();
  var s = getSettings();
  var tc = document.getElementById('timer-color').value || 'blue';
  var tbg = document.getElementById('timer-bg').value || 'black';
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'timer', timerColor: tc, timerBg: tbg, ...s });
  } else {
    window.open('timer.html?wshost=' + s.wsHost + '&wsport=' + s.wsPort + '&color=' + tc + '&bg=' + tbg, 'alttp-timer', 'width=300,height=220,resizable=yes');
  }
}

function launchBoth() {
  save();
  var s = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'both', ...s });
  } else {
    var size = Math.round(512 * parseInt(s.zoom) / 100);
    var mapW = s.layout === 'vertical' ? size + 20 : size * 2 + 32;
    var mapH = size + 92;
    var tbg = document.getElementById('tracker-bg') ? document.getElementById('tracker-bg').value : 'black';
    var di = s.dungeonItems || 'standard';
    window.open('itemtracker.html?scale=' + s.scale + '&bg=' + tbg + '&dungeonitems=' + di + '&bossshuffle=' + s.bossshuffle, 'alttp-items', 'width=500,height=390,resizable=yes');
    window.open(mapUrl(s), 'alttp-map', 'width=' + mapW + ',height=' + mapH + ',resizable=yes');
  }
}


// ── Restore saved values — in Electron pull from electron-store, fallback to localStorage
window.addEventListener('DOMContentLoaded', async function() {
  var saved = {};
  if (IS_ELECTRON) {
    saved = await window.electronAPI.loadSettings();
  }
  var fields = {
    'ws-host':           saved.wsHost        || localStorage.getItem('alttp-ws-host'),
    'ws-port':           saved.wsPort        || localStorage.getItem('alttp-ws-port'),
    'item-scale':        saved.scale         || localStorage.getItem('alttp-item-scale'),
    'map-zoom':          saved.zoom          || localStorage.getItem('alttp-map-zoom'),
    'gt-crystals':       saved.gtCrystals    || localStorage.getItem('alttp-gt-crystals'),
    'gamemode-select':   saved.gamemode      || localStorage.getItem('alttp-gamemode'),
    'dungeonitems-select': saved.dungeonItems || localStorage.getItem('alttp-dungeon-items'),
    'timer-color':       saved.timerColor    || localStorage.getItem('alttp-timer-color'),
    'timer-bg':          saved.timerBg       || localStorage.getItem('alttp-timer-bg'),
    'tracker-bg':        saved.trackerBg     || localStorage.getItem('alttp-tracker-bg'),
  };
  for (var id in fields) {
    var el = document.getElementById(id);
    if (el && fields[id]) el.value = fields[id];
  }
  var enemizer = saved.enemizer || localStorage.getItem('alttp-enemizer') || 'yes';
  var el = document.querySelector('input[name="enemizer"][value="' + enemizer + '"]');
  if (el) el.checked = true;
  var bsv = saved.bossshuffle || localStorage.getItem('alttp-bossshuffle') || 'yes';
  var bsel = document.querySelector('input[name="bossshuffle"][value="' + bsv + '"]');
  if (bsel) bsel.checked = true;
  var gm = saved.gamemode || localStorage.getItem('alttp-gamemode') || 'standard';
  var gmsel = document.getElementById('gamemode-select');
  if (gmsel) gmsel.value = gm;
  var di = saved.dungeonItems || localStorage.getItem('alttp-dungeon-items') || 'standard';
  var disel = document.getElementById('dungeonitems-select');
  if (disel) disel.value = di;
  var slVal = saved.swordless || localStorage.getItem('alttp-swordless') || 'no';
  var slEl = document.querySelector('input[name="swordless"][value="' + slVal + '"]');
  if (slEl) slEl.checked = true;

  // Restore the two custom color pickers used by the timer's Custom options
  var tcCust = localStorage.getItem('alttp-timer-color-custom');
  if (tcCust && document.getElementById('timer-color-custom')) document.getElementById('timer-color-custom').value = tcCust;
  var tbCust = localStorage.getItem('alttp-timer-bg-custom');
  if (tbCust && document.getElementById('timer-bg-custom'))    document.getElementById('timer-bg-custom').value    = tbCust;

});

// ── App Settings panel ────────────────────────────────────────────────────────
function toggleAppSettings() {
  var panel = document.getElementById('app-settings-panel');
  panel.classList.toggle('open');
}
// Close panel when clicking outside
document.addEventListener('click', function(e) {
  var panel = document.getElementById('app-settings-panel');
  var btn   = document.getElementById('app-settings-btn');
  if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
    panel.classList.remove('open');
  }
});

// ── Auto-update UI ────────────────────────────────────────────────────────────
(function() {
  if (!window.electronAPI || !window.electronAPI.onUpdateStatus) return;

  var bar        = document.getElementById('update-bar');
  var barMsg     = document.getElementById('update-bar-msg');
  var panelStatus = document.getElementById('update-panel-status');
  var checkBtn   = document.getElementById('check-update-btn');

  function setBar(msg, type, showInstall) {
    bar.className = 'visible' + (type === 'error' ? ' error' : '');
    barMsg.textContent = msg;
    // Remove any existing install button
    var existing = document.getElementById('install-update-btn');
    if (existing) existing.remove();
    if (showInstall) {
      var btn = document.createElement('button');
      btn.id = 'install-update-btn';
      btn.textContent = '↓ Download';
      btn.onclick = function() { window.electronAPI.installUpdate(); };
      bar.appendChild(btn);
    }
  }

  function hideBar() {
    bar.className = '';
  }

  function setPanelStatus(msg, color) {
    panelStatus.textContent = msg;
    panelStatus.style.color = color || '#666';
  }

  window.electronAPI.onUpdateStatus(function(data) {
    var status = data.status;
    var info   = data.info;

    if (status === 'checking') {
      setPanelStatus('Checking…', '#666');
      checkBtn.disabled = true;
    }
    else if (status === 'up-to-date') {
      hideBar();
      setPanelStatus('You\'re up to date.', '#4dff88');
      checkBtn.disabled = false;
    }
    else if (status === 'available') {
      var ver = info && info.version ? ' v' + info.version : '';
      setBar('Update' + ver + ' available — click to download.', 'info', true);
      setPanelStatus('Update' + ver + ' available.', '#7ab8f5');
      checkBtn.disabled = false;
    }
  });
})();

function manualCheckUpdate() {
  if (!window.electronAPI || !window.electronAPI.checkForUpdates) return;
  document.getElementById('update-panel-status').textContent = 'Checking…';
  document.getElementById('update-panel-status').style.color = '#666';
  var btn = document.getElementById('check-update-btn');
  btn.disabled = true;
  // Re-enable after 10s in case the error was suppressed and no status arrives
  setTimeout(function() {
    btn.disabled = false;
    var status = document.getElementById('update-panel-status');
    if (status.textContent === 'Checking…') status.textContent = '';
  }, 10000);
  window.electronAPI.checkForUpdates();
}
</script>
</body>
</html>
