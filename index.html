<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Randomizer Tracker</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  max-width: 520px; margin: 40px auto; padding: 20px;
  background: #0d0d0d; color: #ccc;
}
h1 { text-align: center; color: #4dff88; font-size: 22px; margin-bottom: 24px; letter-spacing: 1px; }
.section {
  background: #1a1a1a; border: 1px solid #2a2a2a;
  border-radius: 6px; padding: 16px; margin-bottom: 16px;
}
.section h2 { margin: 0 0 12px; color: #7ab8f5; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.row label { color: #666; font-size: 12px; min-width: 80px; }
input, select {
  background: #111; color: #ccc; border: 1px solid #333;
  border-radius: 4px; padding: 5px 8px; font-size: 12px; flex: 1;
}
input:focus, select:focus { outline: none; border-color: #4dff88; }
.info { color: #444; font-size: 10px; margin-top: 2px; padding-left: 90px; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.launch-btn {
  flex: 1; padding: 12px;
  font-size: 14px; font-weight: bold; cursor: pointer;
  border: none; border-radius: 6px; transition: background 0.2s;
}
#btn-items { background: #1a4a2a; color: #4dff88; border: 1px solid #2a7a3a; }
#btn-items:hover { background: #2a6a3a; }
#btn-map   { background: #1a2e4a; color: #7ab8f5; border: 1px solid #2a4e7a; }
#btn-map:hover   { background: #2a4a6a; }
#btn-both  { background: #3a2a00; color: #ffd700; border: 1px solid #7a5a00; }
#btn-both:hover  { background: #5a4000; }
.divider { border: none; border-top: 1px solid #222; margin: 4px 0 12px; }
</style>
</head>
<body>

<h1>⚔ ALTTPR Tracker</h1>
  <p style="text-align: center;">
  <small>Version 1.0.2</small>
</p>

<div class="section">
  <h2>Connection</h2>
  <div class="row">
    <label>Host</label>
    <input id="ws-host" type="text" value="localhost" placeholder="localhost">
  </div>
  <div class="row">
    <label>Port</label>
    <input id="ws-port" type="text" value="23074" placeholder="23074">
  </div>
  <div class="info">QUsb2Snes / SNI — default port 23074</div>
</div>

<div class="section">
  <h2>Display</h2>
  <div class="row">
    <label>Item Scale</label>
    <select id="item-scale">
      <option value="1.0">100%</option>
      <option value="1.1">110%</option>
      <option value="1.2">120%</option>
      <option value="1.3">130%</option>
      <option value="1.4">140%</option>
      <option value="1.5">150%</option>
    </select>
  </div>
  <div class="row">
    <label>Map Scale</label>
    <select id="map-zoom">
      <option value="70">70%</option>
      <option value="80">80%</option>
      <option value="90">90%</option>
      <option value="100" selected>100%</option>
      <option value="110">110%</option>
      <option value="120">120%</option>
      <option value="130">130%</option>
      <option value="140">140%</option>
      <option value="150">150%</option>
    </select>
  </div>
</div>

<div class="section">
  <h2>Settings</h2>
  <div class="row">
    <label>Enemizer</label>
    <div style="display:flex;gap:16px;align-items:center;">
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="enemizer" id="enemizer-yes" value="yes" checked> Yes
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-weight:normal;">
        <input type="radio" name="enemizer" id="enemizer-no" value="no"> No
      </label>
    </div>
  </div>
  <div class="row">
    <label>Ganon's Tower Crystal Requirement</label>
    <select id="gt-crystals">
      <option value="7" selected>7</option>
      <option value="6">6</option>
      <option value="5">5</option>
      <option value="4">4</option>
      <option value="3">3</option>
      <option value="2">2</option>
      <option value="1">1</option>
    </select>
  </div>
</div>

<div class="btn-row">
  <button class="launch-btn" id="btn-items" onclick="launchItems()">Items Only</button>
  <button class="launch-btn" id="btn-map"   onclick="launchMap()">Map Only</button>
  <button class="launch-btn" id="btn-both"  onclick="launchBoth()">Launch Both</button>
</div>

<script>
var IS_ELECTRON = !!(window.electronAPI && window.electronAPI.isElectron);

function getSettings() {
  return {
    wsHost:     document.getElementById('ws-host').value     || 'localhost',
    wsPort:     document.getElementById('ws-port').value     || '23074',
    scale:      document.getElementById('item-scale').value  || '1.0',
    zoom:       document.getElementById('map-zoom').value    || '100',
    layout:     localStorage.getItem('alttp-map-layout')     || 'horizontal',
    enemizer:   document.querySelector('input[name="enemizer"]:checked').value || 'yes',
    gtCrystals: document.getElementById('gt-crystals').value || '7',
  };
}

function save() {
  var s = getSettings();
  localStorage.setItem('alttp-ws-host',     s.wsHost);
  localStorage.setItem('alttp-ws-port',     s.wsPort);
  localStorage.setItem('alttp-item-scale',  s.scale);
  localStorage.setItem('alttp-map-zoom',    s.zoom);
  localStorage.setItem('alttp-enemizer',    s.enemizer);
  localStorage.setItem('alttp-gt-crystals', s.gtCrystals);
}

function mapUrl(s) {
  return 'map.html?zoom=' + s.zoom + '&enemizer=' + s.enemizer + '&gtcrystals=' + s.gtCrystals;
}

function launchItems() {
  save();
  var s = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'items', ...s });
  } else {
    window.open('itemtracker.html?scale=' + s.scale, 'alttp-items', 'width=500,height=390,resizable=yes');
  }
}

function launchMap() {
  save();
  var s    = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'map', ...s });
  } else {
    var size = Math.round(512 * parseInt(s.zoom) / 100);
    var w = s.layout === 'vertical' ? size + 20 : size * 2 + 32;
    var h = size + 92;
    window.open(mapUrl(s), 'alttp-map', 'width=' + w + ',height=' + h + ',resizable=yes');
  }
}

function launchBoth() {
  save();
  var s = getSettings();
  if (IS_ELECTRON) {
    window.electronAPI.launch({ which: 'both', ...s });
  } else {
    var size = Math.round(512 * parseInt(s.zoom) / 100);
    var mapW = s.layout === 'vertical' ? size + 20 : size * 2 + 32;
    var mapH = size + 92;
    window.open('itemtracker.html?scale=' + s.scale, 'alttp-items', 'width=500,height=390,resizable=yes');
    window.open(mapUrl(s), 'alttp-map', 'width=' + mapW + ',height=' + mapH + ',resizable=yes');
  }
}

// Restore saved values — in Electron pull from electron-store, fallback to localStorage
window.addEventListener('DOMContentLoaded', async function() {
  var saved = {};
  if (IS_ELECTRON) {
    saved = await window.electronAPI.loadSettings();
  }
  var fields = {
    'ws-host':    saved.wsHost     || localStorage.getItem('alttp-ws-host'),
    'ws-port':    saved.wsPort     || localStorage.getItem('alttp-ws-port'),
    'item-scale': saved.scale      || localStorage.getItem('alttp-item-scale'),
    'map-zoom':   saved.zoom       || localStorage.getItem('alttp-map-zoom'),
    'gt-crystals':saved.gtCrystals || localStorage.getItem('alttp-gt-crystals'),
  };
  for (var id in fields) {
    if (fields[id]) document.getElementById(id).value = fields[id];
  }
  var enemizer = saved.enemizer || localStorage.getItem('alttp-enemizer') || 'yes';
  var el = document.querySelector('input[name="enemizer"][value="' + enemizer + '"]');
  if (el) el.checked = true;
});
</script>
</body>
</html>
