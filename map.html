<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Map</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src * ws://*:*; img-src 'self' data:; style-src 'self' 'unsafe-inline';">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  font-family: Arial, sans-serif;
  color: #ccc;
  user-select: none;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Topbar ── */
#topbar {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 4px 10px; background: #111; border-bottom: 1px solid #222;
  font-size: 11px;
}
.tb-label { color: #888; }
.tb-select {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 2px 5px; font-size: 11px; cursor: pointer;
}
.tb-sep { color: #333; margin: 0 2px; }
.zoom-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 0 7px; font-size: 15px; line-height: 1.6;
  cursor: pointer; font-weight: bold;
}
.zoom-btn:hover { background: #333; color: #fff; }
#zoom-label { color: #fff; min-width: 40px; text-align: center; font-size: 11px; font-weight: bold; }

/* ── Scroll area ── */
#maps-outer {
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  background: #000;
  min-height: 0;
  padding: 8px 8px 12px 12px;
}
#maps { display: inline-flex; flex-direction: row; gap: 12px; }
#maps.vertical { flex-direction: column; }

.map-wrap {
  position: relative;
  width: 512px; height: 512px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
#lw { background-image: url('map/map_lw.png'); }
#dw { background-image: url('map/map_dw.png'); }

/* ── Check dots ── */
.dot {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
  transition: transform 0.08s;
}
.dot:hover { transform: translate(-50%,-50%) scale(1.5); z-index: 20; }
.dot.available { background: #4dff88; border: 2px solid #000; }
.dot.possible  { background: #ffd700; border: 2px solid #000; }
.dot.visible   { background: #ff8c00; border: 2px solid #000; }
.dot.unavail   { background: #ff4444; border: 2px solid #000; }
.dot.cleared   { background: rgba(40,40,40,0.85); border: 1.5px solid #555; }
.dot.hidden    { display: none; pointer-events: none; }

/* ── Dungeon markers ── */
.dng {
  position: absolute;
  width: 28px; height: 28px;
  border-radius: 3px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
  border: 2px solid #000;
  background: #ff4444;
  overflow: hidden;
  transition: transform 0.08s;
}
.dng:hover { transform: translate(-50%,-50%) scale(1.2); z-index: 25; }
.dng.available   { background: #4dff88; border-color: #000; }
.dng.boss-cleared { background: #9bd0f5; border-color: #000; opacity: 0.75; } /* boss beaten, items remain */
.dng.possible  { background: #ffd700; border-color: #000; }
.dng.visible   { background: #ff8c00; border-color: #000; }
.dng.unavail   { background: #ff4444; border-color: #000; }
.dng.cleared   { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; }
.dng img       { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; }
.dng.no-prize  { font-size: 8px; font-weight: bold; color: #fff; }

/* ── Bottom bar ── */
#bottombar {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  padding: 3px 10px; background: #0a0a0a; border-top: 1px solid #1a1a1a;
  font-size: 10px;
}
#legend { display: flex; align-items: center; gap: 10px; }
.leg    { display: flex; align-items: center; gap: 3px; }
.lb     { width: 10px; height: 10px; border-radius: 2px; }
.lb.available { background: #4dff88; border: 1.5px solid #000; }
.lb.possible  { background: #ffd700; border: 1.5px solid #000; }
.lb.visible   { background: #ff8c00; border: 1.5px solid #000; }
.lb.unavail   { background: #ff4444; border: 1.5px solid #000; }
.lb.cleared   { background: rgba(40,40,40,0.85); border: 1px solid #555; }
#conn-status  { color: #555; font-weight: bold; letter-spacing: 0.3px; }
#conn-status.connected    { color: #4dff88; }
#conn-status.connecting   { color: #ffd700; }
#conn-status.disconnected { color: #555; }
#conn-status.error        { color: #ff4444; }

#reconnect-btn {
  width: 20px; height: 20px;
  font-size: 14px; line-height: 20px; text-align: center; padding: 0;
  background: rgba(0,0,0,0.7); color: #7ab8f5;
  border: 1px solid #3a6ea8; border-radius: 4px;
  cursor: pointer; transition: color 0.2s, background 0.2s;
}
#reconnect-btn:hover { background: #2a5a9c; color: #fff; }
#reconnect-btn:active { transform: scale(0.9); }
#reconnect-btn.spinning {
  color: #ffd700; border-color: #ffd700; cursor: default;
  animation: spin 1s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ── Tooltip ── */
#tip {
  position: fixed; pointer-events: none; z-index: 9999;
  background: rgba(0,0,0,0.92); color: #eee;
  font-size: 11px; padding: 4px 9px;
  border-radius: 3px; border: 1px solid #333;
  white-space: nowrap; display: none;
}
</style>
</head>
<body>

<div id="topbar">
  <span class="tb-label">Layout:</span>
  <select id="layout-sel" class="tb-select" onchange="setLayout(this.value)">
    <option value="horizontal">Horizontal</option>
    <option value="vertical">Vertical</option>
  </select>
  <span class="tb-sep">|</span>
  <button class="zoom-btn" onclick="changeZoom(-1)">&#8722;</button>
  <span id="zoom-label">100%</span>
  <button class="zoom-btn" onclick="changeZoom(+1)">+</button>
</div>

    <button id="reset-btn" title="Reset all checks (new game)" onclick="resetChecks()" style="background:#1a0808;color:#ff6666;border:1px solid #5a2020;border-radius:3px;padding:0 7px;font-size:11px;line-height:1.7;cursor:pointer;" onmouseover="this.style.background='#2a1010'" onmouseout="this.style.background='#1a0808'">⟳ New Game</button>
  </div>
</div>

<div id="tip"></div>

<script>
// ── Early settings init — must run before any logic scripts ──────────────────
(function() {
  var p = new URLSearchParams(window.location.search);
  window.trackerSettings = window.trackerSettings || {};
  window.trackerSettings.gamemode     = p.get('gamemode')     || localStorage.getItem('alttp-gamemode')      || 'standard';
  window.trackerSettings.dungeonItems = p.get('dungeonitems') || localStorage.getItem('alttp-dungeon-items') || 'standard';
  window.trackerSettings.enemizer     = p.get('enemizer')     || localStorage.getItem('alttp-enemizer')      || 'yes';
  window.trackerSettings.swordless    = p.get('swordless')    || localStorage.getItem('alttp-swordless')     || 'no';
  window.trackerSettings.gtCrystals   = parseInt(p.get('gtcrystals') || localStorage.getItem('alttp-gt-crystals') || '7');
  window.trackerSettings.inverted     = window.trackerSettings.gamemode === 'inverted';
})();
</script>

function sramCleared(data, flag) {
  if (!data || !data.length) return false;
  if (Array.isArray(flag[0])) {
    // Group flag: ALL sub-flags must be set
    for (var i = 0; i < flag.length; i++) {
      var off = flag[i][0], mask = flag[i][1];
      if (off >= data.length) return false;
      if ((data[off] & mask) === 0) return false;
    }
    return true;
  }
  // Single flag
  var off = flag[0], mask = flag[1];
  if (off >= data.length) return false;
  return (data[off] & mask) !== 0;
}
window.sramCleared = sramCleared;

// ── Dungeon map positions [left%, top%] ──────────────────────────────────────
// LW dungeons on map_lw, DW dungeons on map_dw
window.DUNGEON_POSITIONS = {
  ep:  { world: 'lw', left: 97.0, top: 40.5, label: 'EP'  },
  dp:  { world: 'lw', left:  7.6, top: 78.4, label: 'DP'  },
  toh: { world: 'lw', left: 57.0, top:  3.0, label: 'ToH' },
  ct:  { world: 'lw', left: 50.0, top: 52.6, label: 'AT'  },
  pod: { world: 'dw', left: 92.8, top: 40.0, label: 'POD' },
  sp:  { world: 'dw', left: 47.0, top: 91.0, label: 'SP'  },
  sw:  { world: 'dw', left:  8.0, top:  7.2, label: 'SW'  },
  tt:  { world: 'dw', left: 12.8, top: 47.9, label: 'TT'  },
  ip:  { world: 'dw', left: 79.6, top: 85.8, label: 'IP'  },
  mm:  { world: 'dw', left: 11.5, top: 84.5, label: 'MM'  },
  tr:  { world: 'dw', left: 92.8, top:  7.2, label: 'TR'  },
  gt:  { world: 'dw', left: 57.0, top:  2.0, label: 'GT'  },
};

// ── Dungeon logic ─────────────────────────────────────────────────────────────
// Returns 'green','yellow','orange','red'
function dungeonColor(key) {
  var it = window.trackerItems;
  var hasMedallion = function(dungeonKey) {
    if (it.mmMedallion > 0 && dungeonKey === 'mm') {
      var med = it.mmMedallion; // 1=bombos,2=ether,3=quake
      return (med === 1 && it.bombos) || (med === 2 && it.ether) || (med === 3 && it.quake);
    }
    if (it.trMedallion > 0 && dungeonKey === 'tr') {
      var med = it.trMedallion;
      return (med === 1 && it.bombos) || (med === 2 && it.ether) || (med === 3 && it.quake);
    }
    // If unset, any medallion works as possibility
    return it.bombos || it.ether || it.quake;
  };

  var settings  = window.trackerSettings;
  var swordless = settings.swordless === 'yes';
  var inverted  = settings.inverted;
  // LW access in inverted: pearl + portal route
  // LW access in inverted — two tiers:
  // lwDM: Death Mountain portal (glove/flute + pearl)
  // lwVillage: Village portal (hammer+glove, titans mitt, or aga+hookshot route) — general LW access
  var lwDM      = !inverted || (it.moonpearl && it.hammer && ((it.gloves >= 1 && it.hookshot) || (it.gloves >= 2 && it.hammer)));
  var lwVillage = !inverted || (
    it.moonpearl &&
    (it.agahnim || it.gloves >= 2 || (it.gloves >= 1 && it.hammer))
  );
  var lwAccess = lwVillage; // default general LW access

  switch (key) {
    case 'ep': {
      // Inverted: EP is in LW — requires moon pearl to access
      if (!lwAccess) return 'red';
      // Non-enemizer: bow required to beat Armos Knights
      if (settings.enemizer === 'no' && !it.bow) return 'yellow';
      if (settings.dungeonItems === 'keysanity') {
        if (!it.epBigKey) return 'yellow';
      }
      return it.lamp ? 'green' : 'yellow';
    }

    case 'dp':
      // Inverted: DP is in LW — requires LW access + book only (mirror route not available in inverted)
      if (!lwAccess) return 'red';
      var hasAccess = inverted ? it.book : (it.book || (it.mirror && it.flute && it.gloves >= 2));
      if (!hasAccess) return 'red';
      if (!it.boots || !it.gloves || (!it.lamp && !it.firerod)) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var dpKeys = (it.dpSmallKeys) || 0;
        if (dpKeys < 1) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.dpBigKey) return 'yellow';
      }
      return 'green';

    case 'toh':
      // Inverted: TOH is on DM — accessible via DM portal (glove+pearl)
      if (!lwDM) return 'red';
      // Inverted: TOH requires hammer to enter
      if (inverted && !it.hammer) return 'red';
      // Access routes (standard/open):
      // flute + mirror
      // flute + hookshot + hammer
      // lamp + gloves + mirror
      // lamp + gloves + hookshot + hammer
      var flute   = it.flute >= 1;
      var gloves  = it.gloves >= 1;
      var mirror  = it.mirror >= 1;
      var hookham = it.hookshot && it.hammer;
      var canAccess = inverted
        ? (it.hammer)  // inverted: hammer is the requirement; DM portal already checked via lwDM
        : ((flute && mirror) ||
           (flute && hookham) ||
           (it.lamp && gloves && mirror) ||
           (it.lamp && gloves && hookham));
      if (!canAccess) return 'red';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var tohKeys = (it.tohSmallKeys) || 0;
        if (tohKeys < 1) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.tohBigKey) return 'yellow';
      }
      // Yellow if using flute route without lamp/firerod
      return (it.lamp || it.firerod) ? 'green' : 'yellow';

    case 'hc':
      // Inverted: HC is in LW — requires LW access
      if (!lwAccess) return 'red';
      return it.lamp ? 'green' : 'yellow';

    case 'ct': {
      if (inverted) {
        // Inverted: Aga1 is in GT (DW Death Mountain) — needs to climb DW DM
        // DW is home world so no pearl needed; glove to reach DM, or flute (needs LW village access to activate)
        var dwDMAccess = it.gloves >= 1 || (it.flute >= 1 && lwVillage);
        if (!dwDMAccess) return 'red';
        // Aga1 requires lamp + any sword or hammer (or cape, or swordless hammer)
        if (!it.lamp) return 'red';
        if (!(it.sword >= 1 || it.hammer || it.cape)) return 'red';
        if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
          var ctKeys = (it.ctSmallKeys) || 0;
          return ctKeys >= 2 ? 'green' : 'red';
        }
        return 'green';
      }
      // Standard/open: CT is in LW — requires LW access
      if (!lwAccess) return 'red';
      // Red until lamp AND (master sword OR cape OR [swordless] hammer)
      if (!it.lamp) return 'red';
      if (!(it.sword >= 2 || it.cape || (swordless && it.hammer))) return 'red';
      
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var ctKeys = (it.ctSmallKeys) || 0;
        return ctKeys >= 2 ? 'green' : 'red';
      }
      return 'green';
    }

    case 'pod':
      // Inverted: DW is home world — no moonpearl needed for DW access
      // But still need DW east access route
      if (!inverted && !it.moonpearl) return 'red';
      var dwEastPOD = inverted
        ? (it.hammer || (it.flute >= 1 && lwVillage) || it.flippers)
        : (it.moonpearl && (it.agahnim || (it.gloves >= 2 && it.flippers) || (it.hammer && it.gloves >= 1)));
      if (!dwEastPOD) return 'red';
      if (!it.hammer || !it.lamp || !it.bow) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        var podKeys = (it.podSmallKeys) || 0;
        if (podKeys < 6) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {
        if (!it.podBigKey) return 'yellow';
      }
      return 'green';

    case 'sp':
      // Inverted: DW is home world — no moonpearl needed
      // Still needs mirror + flippers + DW south access
      if (!inverted && (!it.moonpearl || !it.mirror || !it.flippers)) return 'red';
      if (inverted && (!it.mirror || !it.flippers)) return 'red';
      var dwSouthSP = (it.agahnim && it.hammer) || (it.hammer && it.gloves >= 1) || (it.gloves >= 2);
      if (!dwSouthSP) return 'red';
      if (it.gloves >= 2 && !it.hammer) return 'yellow';
      if (['keysanity','mapcompasskeys'].includes(settings.dungeonItems)) {
        if (!it.spSmallKeys) return 'yellow';
      }
      if (settings.dungeonItems === 'keysanity') {

    // Ganon (visually at CT/LW position, accessed via dngEls['ct'] after swap) — village portal + crystals
    (function() {
      var el = dngEls['ct'];
      if (!el || DUNGEONS['ct'].cleared || DUNGEONS['ct'].fullyCleared) return;
      var req = (window.trackerSettings && window.trackerSettings.gtCrystals) || 7;
      var crystals = (window.trackerItems && window.trackerItems.crystals) || 0;
      el.className = (lwVillageOk && crystals >= req) ? 'dng available' : 'dng unavail';
    })();
    // Aga1 (visually at GT/DW position, accessed via dngEls['gt'] after swap) — DW DM access + lamp + weapon
    (function() {
      var el = dngEls['gt'];
      if (!el || DUNGEONS['gt'].cleared || DUNGEONS['gt'].fullyCleared) return;
      var dwDMAccess = glove2 || (window.trackerItems && window.trackerItems.flute >= 1 && lwVillageOk);
      var lamp2   = window.trackerItems && window.trackerItems.lamp;
      var sword2  = window.trackerItems && window.trackerItems.sword >= 1;
      var cape2   = window.trackerItems && window.trackerItems.cape;
      var weapon2 = sword2 || hammer2 || cape2;
      var diMode  = window.trackerSettings && window.trackerSettings.dungeonItems;
      var ctKeys  = (window.trackerItems && window.trackerItems.ctSmallKeys) || 0;
      var keysOk  = ['keysanity','mapcompasskeys'].includes(diMode) ? ctKeys >= 2 : true;
      el.className = (dwDMAccess && lamp2 && weapon2 && keysOk) ? 'dng available' : 'dng unavail';
    })();
    // TOH is on Death Mountain — DM portal (glove+pearl) + hammer required
    (function() {
      var el = dngEls['toh'];
      if (!el || DUNGEONS['toh'].cleared || DUNGEONS['toh'].fullyCleared) return;
      if (!lwDMok || !hammer2) el.className = 'dng unavail';
    })();
  }
};

function dngStatusText(key) {
  var t = { green:'Available', yellow:'Possible', orange:'Visible only', red:'Unavailable' };
  return t[window.dungeonColor(key)] || '';
}

// ── SRAM autotracking via BroadcastChannel ────────────────────────────────────
window.onRoomsUpdated = function(data) {
  // Auto-clear check dots
  var dirty = false;
  CHECKS.forEach(function(c) {
    var id = c[0];
    if (!checkState[id] && window.SRAM_FLAGS[id] && window.sramCleared(data, window.SRAM_FLAGS[id])) {
      checkState[id] = true;
      if (dotById[id]) dotById[id].className = dotClass(id);
      dirty = true;
    }
  });
  if (dirty) saveCheckState();

  // Boss defeat → clear dungeon
  Object.keys(DUNGEONS).forEach(function(key) {
    var def = DUNGEONS[key];
    // CT (Agahnim) uses a different SRAM flag — offset 0x3c5 >= 3
    // In inverted: CT is Aga1 (DW DM) — use GT's bossOffset instead; GT is Ganon (LW) — use CT's SRAM flag
    if (key === 'ct') {
      var inv = window.trackerSettings && window.trackerSettings.inverted;
      if (inv) {
        // Aga1 cleared via GT bossOffset (0x01b)
        if (0x01b < data.length && (data[0x01b] & 0x08) !== 0 && !def.cleared) {
          def.cleared = true;
          def.fullyCleared = true;
          refreshDungeonImg(key);
          window.refreshMapLogic();
        }
      } else {
        if (0x3c5 < data.length && data[0x3c5] >= 3 && !def.cleared) {
          def.cleared = true;
          def.fullyCleared = true;
          refreshDungeonImg(key);
          window.refreshMapLogic();
        }
      }
      return;
    }
    // GT (Ganon) in inverted is at CT location — use CT's SRAM flag (0x3c5 >= 3)
    // Must always return early in inverted to prevent generic loop firing on GT's bossOffset (0x01b = same as Aga1)
    if (key === 'gt') {
      var inv = window.trackerSettings && window.trackerSettings.inverted;
      if (inv) {
        if (0x3c5 < data.length && data[0x3c5] >= 3 && !def.cleared) {
          def.cleared = true;
          def.fullyCleared = true;
          refreshDungeonImg(key);
          window.refreshMapLogic();
        }
        return; // always return — don't fall through to generic bossOffset loop
      }
    }
    if (def.bossOffset === null || def.bossOffset === undefined || def.bossOffset >= data.length) return;
    if ((data[def.bossOffset] & 0x08) !== 0 && !def.cleared) {
      def.cleared = true;
      refreshDungeonImg(key);
      window.refreshMapLogic();
    }
  });
};

// Track last time rooms data arrived via BroadcastChannel
var _lastBcRooms = 0;

try {
  var _bc = new BroadcastChannel('alttp-tracker');
  _bc.onmessage = function(e) {
    if (!e.data) return;
    switch (e.data.type) {
      case 'medallions':
        window.trackerItems.mmMedallion = e.data.data.mmMedallion !== undefined ? e.data.data.mmMedallion : window.trackerItems.mmMedallion;
        window.trackerItems.trMedallion = e.data.data.trMedallion !== undefined ? e.data.data.trMedallion : window.trackerItems.trMedallion;
        window.refreshMapLogic();
        break;
      case 'items':
        // Merge snap into trackerItems, preserving prize-derived and medallion fields
        // Use !== undefined so snap value of 0 is respected (not treated as "missing")
        var snap = e.data.data;
        var savedCrystals     = window.trackerItems.crystals     || 0;
        var savedPendants     = window.trackerItems.pendants     || 0;
        var savedGreenPendant = window.trackerItems.greenPendant || 0;
        var savedRedCrystal   = window.trackerItems.redCrystal   || 0;
        var savedMmMed        = window.trackerItems.mmMedallion  || 0;
        var savedTrMed        = window.trackerItems.trMedallion  || 0;
        window.trackerItems = snap;
        window.trackerItems.crystals     = snap.crystals     !== undefined ? snap.crystals     : savedCrystals;
        window.trackerItems.pendants     = snap.pendants     !== undefined ? snap.pendants     : savedPendants;
        window.trackerItems.greenPendant = snap.greenPendant !== undefined ? snap.greenPendant : savedGreenPendant;
        window.trackerItems.redCrystal   = snap.redCrystal   !== undefined ? snap.redCrystal   : savedRedCrystal;
        window.trackerItems.mmMedallion  = snap.mmMedallion  !== undefined ? snap.mmMedallion  : savedMmMed;
        window.trackerItems.trMedallion  = snap.trMedallion  !== undefined ? snap.trMedallion  : savedTrMed;
        window.trackerItems.ctSmallKeys  = snap.ctSmallKeys  !== undefined ? snap.ctSmallKeys  : (window.trackerItems.ctSmallKeys || 0);
        window.trackerItems.spSmallKeys  = snap.spSmallKeys  !== undefined ? snap.spSmallKeys  : (window.trackerItems.spSmallKeys || 0);
        window.trackerItems.dpSmallKeys  = snap.dpSmallKeys  !== undefined ? snap.dpSmallKeys  : (window.trackerItems.dpSmallKeys || 0);
        window.trackerItems.tohSmallKeys  = snap.tohSmallKeys  !== undefined ? snap.tohSmallKeys  : (window.trackerItems.tohSmallKeys || 0);
        window.trackerItems.podSmallKeys  = snap.podSmallKeys  !== undefined ? snap.podSmallKeys  : (window.trackerItems.podSmallKeys || 0);
        window.trackerItems.ttSmallKeys  = snap.ttSmallKeys  !== undefined ? snap.ttSmallKeys  : (window.trackerItems.ttSmallKeys || 0);
        window.trackerItems.ipSmallKeys  = snap.ipSmallKeys  !== undefined ? snap.ipSmallKeys  : (window.trackerItems.ipSmallKeys || 0);
        window.trackerItems.mmSmallKeys  = snap.mmSmallKeys  !== undefined ? snap.mmSmallKeys  : (window.trackerItems.mmSmallKeys || 0);
        window.trackerItems.trSmallKeys  = snap.trSmallKeys  !== undefined ? snap.trSmallKeys  : (window.trackerItems.trSmallKeys || 0);
        window.trackerItems.swSmallKeys  = snap.swSmallKeys  !== undefined ? snap.swSmallKeys  : (window.trackerItems.swSmallKeys || 0);
        window.trackerItems.gtSmallKeys  = snap.gtSmallKeys  !== undefined ? snap.gtSmallKeys  : (window.trackerItems.gtSmallKeys || 0);
        window.trackerItems.epBigKey     = snap.epBigKey     !== undefined ? snap.epBigKey     : (window.trackerItems.epBigKey || 0);
        window.trackerItems.dpBigKey     = snap.dpBigKey     !== undefined ? snap.dpBigKey     : (window.trackerItems.dpBigKey || 0);
        window.trackerItems.tohBigKey     = snap.tohBigKey     !== undefined ? snap.tohBigKey     : (window.trackerItems.tohBigKey || 0);
        window.trackerItems.podBigKey     = snap.podBigKey     !== undefined ? snap.podBigKey     : (window.trackerItems.podBigKey || 0);
        window.trackerItems.ttBigKey     = snap.ttBigKey     !== undefined ? snap.ttBigKey     : (window.trackerItems.ttBigKey || 0);
        window.trackerItems.ipBigKey     = snap.ipBigKey     !== undefined ? snap.ipBigKey     : (window.trackerItems.ipBigKey || 0);
        window.trackerItems.mmBigKey     = snap.mmBigKey     !== undefined ? snap.mmBigKey     : (window.trackerItems.mmBigKey || 0);
        window.trackerItems.trBigKey     = snap.trBigKey     !== undefined ? snap.trBigKey     : (window.trackerItems.trBigKey || 0);
        window.trackerItems.spBigKey     = snap.spBigKey     !== undefined ? snap.spBigKey     : (window.trackerItems.spBigKey || 0);
        window.trackerItems.swBigKey     = snap.swBigKey     !== undefined ? snap.swBigKey     : (window.trackerItems.swBigKey || 0);
        // Agahnim defeated → mark CT fully cleared (standard mode only)
        // In inverted, Aga1 is at CT position on DW — cleared via SRAM boss flag, not agahnim item
        if (snap.agahnim && !DUNGEONS.ct.cleared && !(window.trackerSettings && window.trackerSettings.inverted)) {
          DUNGEONS.ct.cleared = true;
          DUNGEONS.ct.fullyCleared = true;
          refreshDungeonImg('ct');
        }
        window.refreshMapLogic();
        break;
      case 'rooms':
        _lastBcRooms = Date.now();
        window.onRoomsUpdated(e.data.data);
        // If map's own WS isn't connected, show that BC is feeding data
        if (!_mapWs || _mapWs.readyState !== WebSocket.OPEN) {
          setConnStatus('Tracking via Item Tracker', 'connected');
        }
        break;
      case 'prizes':
        var pz = e.data.data;
        // In inverted: item tracker broadcasts under physical dungeon keys, but CT and GT have swapped
        // locations on the map — remap pz['ct']↔pz['gt'] so state applies to the right marker
        if (window.trackerSettings && window.trackerSettings.inverted && pz['ct'] && pz['gt']) {
          var _tmp = pz['ct']; pz['ct'] = pz['gt']; pz['gt'] = _tmp;
        }
        // Update medallion assignments if included in message
        if (window.trackerItems) {
          if (e.data.mmMedallion !== undefined) window.trackerItems.mmMedallion = e.data.mmMedallion;
          if (e.data.trMedallion !== undefined) window.trackerItems.trMedallion = e.data.trMedallion;
        }
        Object.keys(pz).forEach(function(key) {
          if (!DUNGEONS[key]) return;
          // In inverted, CT and GT have fixed boss images — skip prize cycle image updates
          var inv = window.trackerSettings && window.trackerSettings.inverted;
          if (inv && (key === 'ct' || key === 'gt')) {
            // Only update cleared state, not prize/image
            if (pz[key].allItems !== undefined) {
              DUNGEONS[key].fullyCleared = pz[key].allItems && pz[key].obtained;
            }
            DUNGEONS[key].prizeObtained = pz[key].obtained || false;
            refreshDungeonImg(key);
            return;
          }
          var prizeName = pz[key].name || 'unknown';
          var idx = prizeIndexByName(prizeName);
          DUNGEONS[key].prize      = idx;
          // Don't overwrite img/imgCleared for fixed-prize dungeons (CT/GT)
          if (DUNGEONS[key].prize !== -2) {
            DUNGEONS[key].img        = PRIZE_CYCLE[idx].img;
            DUNGEONS[key].imgCleared = PRIZE_CYCLE[idx].imgCleared;
          }
          DUNGEONS[key].prizeObtained  = pz[key].obtained || false;
          DUNGEONS[key].mapObtained    = pz[key].mapState === 1;
          DUNGEONS[key].otherCleared   = pz[key].otherCleared || false;
          // Set fullyCleared: all items collected AND boss beaten (prize obtained)
          if (pz[key].allItems !== undefined) {
            DUNGEONS[key].fullyCleared = pz[key].allItems && pz[key].obtained;
          }
          refreshDungeonImg(key);
        });
        // Pendant/crystal counts from obtained prizes only
        if (window.trackerItems) {
          var pc=0, gpc=0, rc=0, cc=0;
          Object.keys(DUNGEONS).forEach(function(k) {
            var def = DUNGEONS[k];
            if (!def.prizeObtained) return;
            var pname = PRIZE_CYCLE[def.prize] ? PRIZE_CYCLE[def.prize].name : '';
            if      (pname==='crystal')      { cc++; }
            else if (pname==='redcrystal')   { cc++; rc++; }
            else if (pname==='pendant')      { pc++; }
            else if (pname==='greenpendant') { pc++; gpc++; }
          });
          window.trackerItems.crystals     = cc;
          window.trackerItems.pendants     = pc;
          window.trackerItems.greenPendant = gpc;
          window.trackerItems.redCrystal   = rc;
        }
        window.refreshMapLogic();
        break;
      case 'dungeonComplete':
        var dc = e.data.data;
        Object.keys(dc).forEach(function(key) {
          if (!DUNGEONS[key]) return;
          var prev = DUNGEONS[key].fullyCleared;
          DUNGEONS[key].fullyCleared = dc[key].allItems && dc[key].prizeCollected;
          if (DUNGEONS[key].fullyCleared !== prev) {
            window.refreshMapLogic();
          }
        });
        break;
      case 'status':
        setConnStatus(e.data.text, e.data.cls);
        break;
      case 'newgame':
        if (!_resettingGame) resetChecks();
        break;
    }
  };
} catch(ex) {}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function showTip(text, e) { var t = document.getElementById('tip'); t.textContent = text; t.style.display = 'block'; moveTip(e); }
function hideTip()        { document.getElementById('tip').style.display = 'none'; }
function moveTip(e) {
  var t = document.getElementById('tip');
  var x = e.clientX + 14, y = e.clientY - 30;
  if (x + 200 > window.innerWidth)  x = e.clientX - 210;
  if (y < 4) y = e.clientY + 14;
  t.style.left = x + 'px';
  t.style.top  = y + 'px';
}

// ── Zoom + Layout ─────────────────────────────────────────────────────────────
// Declare zoom state first so resizeWindowToMap can reference it
var ZOOM_STEPS = [70, 80, 90, 100, 110, 120, 130, 140, 150];
var zoomIdx = 1;

// Non-map chrome: topbar (~28px) + bottombar (~24px) + OS window chrome (~40px)
var CHROME_H = 92;

function resizeWindowToMap() {
  var pct    = ZOOM_STEPS[zoomIdx];
  var size   = Math.round(512 * pct / 100);
  var maps   = document.getElementById('maps');
  var isVert = maps ? maps.classList.contains('vertical') : false;
  var chromeW = window.outerWidth  - window.innerWidth;
  var chromeH = window.outerHeight - window.innerHeight;
  // Fall back to fixed estimate if browser reports 0 (e.g. before first paint)
  if (chromeW <= 0) chromeW = 16;
  if (chromeH <= 0) chromeH = CHROME_H;
  // topbar ~30px + bottombar ~24px + maps-outer padding ~28px + buffer = ~100px content chrome
  var contentChrome = 100;
  var w = (isVert ? size + 28 : size * 2 + 40) + chromeW;
  var h = (isVert ? size * 2 + 12 + contentChrome : size + contentChrome) + chromeH;
  try { window.resizeTo(w, h); } catch(e) {}
}

function setLayout(val) {
  var maps = document.getElementById('maps');
  if (val === 'vertical') maps.classList.add('vertical');
  else maps.classList.remove('vertical');
  try { localStorage.setItem('alttp-map-layout', val); } catch(ex) {}
  resizeWindowToMap();
}

function applyZoom() {
  var pct  = ZOOM_STEPS[zoomIdx];
  var size = Math.round(512 * pct / 100);
  document.querySelectorAll('.map-wrap').forEach(function(el) {
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
  });
  document.getElementById('zoom-label').textContent = pct + '%';
  try { localStorage.setItem('alttp-map-zoom', String(pct)); } catch(ex) {}
  resizeWindowToMap();
}
function changeZoom(dir) {
  zoomIdx = Math.max(0, Math.min(ZOOM_STEPS.length - 1, zoomIdx + dir));
  applyZoom();
}

// ── Init layout + zoom from URL params / localStorage ────────────────────────
(function() {
  var p = new URLSearchParams(window.location.search);

  // In Electron, fix image paths to point to the unpacked asset folder
  var _assetBase = p.get('assetbase');
  if (_assetBase) {
    var _mapBase = _assetBase.replace(/\\/g, '/') + '/map';
    // Fix CSS background images for LW/DW maps
    var lwEl = document.getElementById('lw');
    var dwEl = document.getElementById('dw');
    if (lwEl) lwEl.style.backgroundImage = "url('" + _mapBase + "/map_lw.png')";
    if (dwEl) dwEl.style.backgroundImage = "url('" + _mapBase + "/map_dw.png')";
    // Fix dungeon prize/boss image paths
    Object.keys(DUNGEONS).forEach(function(key) {
      var d = DUNGEONS[key];
      if (d.img)        d.img        = d.img.replace('map/',        _mapBase + '/');
      if (d.imgCleared) d.imgCleared = d.imgCleared.replace('map/', _mapBase + '/');
    });
  }

  // Enemizer and GT crystal settings from launcher
  window.trackerSettings = window.trackerSettings || {};
  window.trackerSettings.enemizer   = p.get('enemizer')   || localStorage.getItem('alttp-enemizer')   || 'yes';
  window.trackerSettings.gtCrystals = parseInt(p.get('gtcrystals') || localStorage.getItem('alttp-gt-crystals') || '7');
  window.trackerSettings.gamemode      = p.get('gamemode')      || localStorage.getItem('alttp-gamemode')      || 'standard';
  window.trackerSettings.dungeonItems  = p.get('dungeonitems')  || localStorage.getItem('alttp-dungeon-items')  || 'standard';
  window.trackerSettings.swordless     = p.get('swordless')     || localStorage.getItem('alttp-swordless')     || 'no';
  window.trackerSettings.inverted      = window.trackerSettings.gamemode === 'inverted';

  // Refresh map logic now that settings are known
  window.refreshMapLogic();

  // Restore zoom index
  var pct  = parseInt(p.get('scale') || p.get('zoom') || '0') ||
             parseInt(localStorage.getItem('alttp-map-zoom') || '0') || 100;
  var best = 1, bestD = 9999;
  ZOOM_STEPS.forEach(function(z, i) { var d = Math.abs(z - pct); if (d < bestD) { bestD = d; best = i; } });
  zoomIdx = best;

  // Apply zoom (sets map-wrap sizes + resizes window)
  applyZoom();

  // Apply layout (also resizes window, which is fine — same size if horizontal default)
  var val = p.get('layout') || localStorage.getItem('alttp-map-layout') || 'horizontal';
  var sel = document.getElementById('layout-sel');
  if (sel) sel.value = val;
  setLayout(val);
})();

// ── Initialise prize counts in trackerItems from DUNGEONS defaults ────────────
(function() {
  var pc=0, gpc=0, rc=0, cc=0;
  Object.keys(DUNGEONS).forEach(function(k) {
    var def = DUNGEONS[k];
    if (!def.prizeObtained) return;
    var pname = PRIZE_CYCLE[def.prize] ? PRIZE_CYCLE[def.prize].name : '';
    if      (pname==='crystal')      { cc++; }
    else if (pname==='redcrystal')   { cc++; rc++; }
    else if (pname==='pendant')      { pc++; }
    else if (pname==='greenpendant') { pc++; gpc++; }
  });
  window.trackerItems.crystals     = cc;
  window.trackerItems.pendants     = pc;
  window.trackerItems.greenPendant = gpc;
  window.trackerItems.redCrystal   = rc;
})();

window.refreshMapLogic();

// ── Map's own WebSocket connection ────────────────────────────────────────────
// The map connects independently so it works even without the item tracker open.
var _mapWs = null;
var _mapReconnectTimer = null;
var _mapPollTimer = null;

function setConnStatus(text, cls) {
  var el = document.getElementById('conn-status');
  el.textContent = '● ' + text;
  el.className = cls || 'disconnected';
}

function mapConnect() {
  var host = localStorage.getItem('alttp-ws-host') || 'localhost';
  var port = localStorage.getItem('alttp-ws-port') || '23074';

  if (_mapWs) { _mapWs.onclose = null; _mapWs.onerror = null; _mapWs.close(); _mapWs = null; }
  clearTimeout(_mapReconnectTimer); clearInterval(_mapPollTimer);

  setConnStatus('Connecting…', 'connecting');
  try { _mapWs = new WebSocket('ws://' + host + ':' + port); }
  catch(e) { setConnStatus('Error', 'error'); _scheduleReconnect(); return; }
  _mapWs.binaryType = 'arraybuffer';

  var _attached = false;

  _mapWs.onopen = function() {
    _mapWs.send(JSON.stringify({ Opcode: 'DeviceList', Space: 'SNES' }));
  };

  var _mapRoomChunk1 = null;
  var _mapRoomChunk1Time = 0;
  _mapWs.onmessage = function(evt) {
    if (evt.data instanceof ArrayBuffer) {
      var data = new Uint8Array(evt.data);
      if (data.length === 0x280) {
        var now = Date.now();
        if (_mapRoomChunk1 === null || (now - _mapRoomChunk1Time) > 1500) {
          _mapRoomChunk1 = data;
          _mapRoomChunk1Time = now;
        } else {
          var merged = new Uint8Array(0x500);
          merged.set(_mapRoomChunk1, 0);
          merged.set(data, 0x280);
          _mapRoomChunk1 = null;
          _mapRoomChunk1Time = 0;
          window.onRoomsUpdated(merged);
        }
      } else if (data.length === 0x420 || data.length === 0x500) {
        window.onRoomsUpdated(data);
      }
      return;
    }
    var r; try { r = JSON.parse(evt.data); } catch(e) { return; }
    if (!r.Results) return;
    if (!_attached) {
      if (!r.Results.length) { setConnStatus('No device', 'disconnected'); _scheduleReconnect(); return; }
      var dev = r.Results[0];
      _mapWs.send(JSON.stringify({ Opcode: 'Attach', Space: 'SNES', Operands: [dev] }));
      _mapWs.send(JSON.stringify({ Opcode: 'Name',   Space: 'SNES', Operands: ['ALTTP Map'] }));
      _attached = true;
      setConnStatus('Connected', 'connected');
      // Poll room data in two chunks — skip if BroadcastChannel is feeding fresh data
      _mapPollTimer = setInterval(function() {
        var bcFresh = (Date.now() - _lastBcRooms) < 3000;
        if (!bcFresh && _mapWs && _mapWs.readyState === WebSocket.OPEN) {
          _mapWs.send(JSON.stringify({ Opcode: 'GetAddress', Space: 'SNES', Operands: ['F5F000', '280'] }));
          _mapWs.send(JSON.stringify({ Opcode: 'GetAddress', Space: 'SNES', Operands: ['F5F280', '280'] }));
        }
      }, 1000);
    }
  };

  _mapWs.onerror = function() {
    // Don't show error if item tracker BC is feeding us data
    if ((Date.now() - _lastBcRooms) > 5000) {
      setConnStatus('Error — retrying…', 'error');
    }
  };
  _mapWs.onclose = function() {
    clearInterval(_mapPollTimer);
    _attached = false;
    if ((Date.now() - _lastBcRooms) > 5000) {
      setConnStatus('Disconnected — retrying…', 'disconnected');
    }
    _scheduleReconnect();
  };
}

function _scheduleReconnect() {
  clearTimeout(_mapReconnectTimer);
  _mapReconnectTimer = setTimeout(mapConnect, 3000);
}

function mapReconnect() {
  var btn = document.getElementById('reconnect-btn');
  btn.classList.add('spinning'); btn.disabled = true;
  clearTimeout(_mapReconnectTimer);
  mapConnect();
  setTimeout(function() { btn.classList.remove('spinning'); btn.disabled = false; }, 3000);
}

// Auto-connect on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mapConnect);
  // Re-run resize after full page load so browser chrome dimensions are accurate
  window.addEventListener('load', function() {
    setTimeout(resizeWindowToMap, 150);
  });
} else {
  mapConnect();
}
</script>
