<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Timer</title>
<meta http-equiv="Content-Security-Policy" content="connect-src * ws://*:*;">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Arial, sans-serif;
  background: #000000;
  color: #ccc;
  display: flex;
  flex-direction: column;
  height: 100vh;
  user-select: none;
  overflow: hidden;
}

.size-btn {
  width: 18px;
  height: 18px;
  background: #1a1a1a;
  color: #888;
  border: 1px solid #333;
  border-radius: 3px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
}
.size-btn:hover { background: #333; color: #fff; }
.size-btn:active { transform: scale(0.9); }

/* ── Main content area ── */
#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

/* ── Timer display ── */
.timer-display { text-align: center; }

#timer-main {
  font-size: 52px;
  font-weight: bold;
  color: var(--timer-color, #3498db);
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
  transition: font-size 0.15s;
}

#timer-centis {
  font-size: 30px;
  font-weight: bold;
  color: var(--timer-color-dim, #2a7ab8);
  font-variant-numeric: tabular-nums;
  transition: font-size 0.15s;
}

.timer-display.running #timer-main   { color: var(--timer-color, #3498db); }
.timer-display.running #timer-centis { color: var(--timer-color-dim, #2a7ab8); }
.timer-display.finished #timer-main   { color: var(--timer-color, #3498db); opacity: 0.7; }
.timer-display.finished #timer-centis { color: var(--timer-color-dim, #2a7ab8); opacity: 0.7; }

/* ── Controls ── */
.controls {
  display: flex;
  gap: 8px;
}

.ctrl-btn {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.ctrl-btn:active { transform: scale(0.92); }

#btn-playpause { background: #1a5c2e; color: #2ecc71; border: 1px solid #2ecc71; }
#btn-playpause:hover { background: #2ecc71; color: #000; }
#btn-playpause.running { background: #5c4a00; color: #ffd700; border-color: #ffd700; }
#btn-playpause.running:hover { background: #ffd700; color: #000; }

#btn-reset { background: #1a1a1a; color: #888; border: 1px solid #444; }
#btn-reset:hover { background: #444; color: #fff; }

/* ── Set time ── */
.set-time {
  display: flex;
  align-items: center;
  gap: 6px;
}

.set-time input {
  background: #111;
  color: #ccc;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 13px;
  font-family: monospace;
  text-align: center;
  width: 90px;
}
.set-time input:focus { outline: none; border-color: #3498db; }

.set-btn {
  background: #1a2e4a;
  color: #7ab8f5;
  border: 1px solid #2a4e7a;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
}
.set-btn:hover { background: #2a4a6a; }

/* ── Bottom bar: size buttons left, status centre ── */
#bottombar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 8px;
  background: #0a0a0a;
  border-top: 1px solid #1a1a1a;
  flex-shrink: 0;
  gap: 6px;
}

.size-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

#conn-status {
  font-size: 10px;
  color: #555;
}
#conn-status.connected    { color: #2ecc71; }
#conn-status.connecting   { color: #f39c12; }
#conn-status.disconnected { color: #e74c3c; }

/* ── Background themes ── */
[data-bg="grey"]        body { background: #2a2a2a; }
[data-bg="white"]       body { background: #ffffff; }
html[data-bg="transparent"] body { background: transparent !important; background-color: transparent !important; padding-top: 30px; }
html[data-bg="transparent"] body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 140px;   /* leave room for Windows caption buttons */
    height: 30px;
    -webkit-app-region: drag;
    z-index: 9999;
}
html[data-bg="transparent"] #bottombar {
    background: rgba(0,0,0,0.5) !important;
    border-top-color: rgba(255,255,255,0.15) !important;
    -webkit-app-region: drag;
    cursor: move;
}
html[data-bg="transparent"] #bottombar * {
    -webkit-app-region: no-drag;
    cursor: default;
}
html[data-bg="transparent"] #content, html[data-bg="transparent"] #timer-display { background: transparent !important; }
html[data-bg="transparent"] .set-time input { background: rgba(0,0,0,0.4) !important; border-color: rgba(255,255,255,0.2) !important; }
html[data-bg="transparent"] .set-btn { background: rgba(0,30,60,0.6) !important; }

/* Grey: dark bottom bar matching item tracker style */
[data-bg="grey"]  #bottombar  { background: #0a0a0a; border-top-color: #1a1a1a; }
[data-bg="grey"]  #conn-status { color: #95a5a6; }
[data-bg="grey"]  #conn-status.connected    { color: #2ecc71; }
[data-bg="grey"]  #conn-status.connecting   { color: #f39c12; }
[data-bg="grey"]  #conn-status.disconnected { color: #e74c3c; }
[data-bg="grey"]  .size-btn   { background: #1a1a1a; color: #888; border-color: #333; }
[data-bg="grey"]  .size-btn:hover { background: #333; color: #fff; }
[data-bg="grey"]  .set-time input { background: #3d3d3d; color: #ccc; border-color: #555; }
[data-bg="grey"]  .set-btn    { background: #1a2e4a; color: #7ab8f5; border-color: #2a4e7a; }

/* White: light bottom bar */
[data-bg="white"] #bottombar  { background: #e0e0e0; border-top-color: #bbb; }
[data-bg="white"] #conn-status { color: #444; }
[data-bg="white"] #conn-status.connected    { color: #1a7a1a; }
[data-bg="white"] #conn-status.disconnected { color: #cc2200; }
[data-bg="white"] .size-btn   { background: #ccc; color: #333; border-color: #aaa; }
[data-bg="white"] .size-btn:hover { background: #bbb; color: #000; }
[data-bg="white"] .set-time input { background: #eee; color: #111; border-color: #aaa; }
[data-bg="white"] .set-btn    { background: #c8dcf0; color: #1a4a7a; border-color: #aac; }
</style>
</head>
<body>

<div id="content">
  <div class="timer-display" id="timer-display">
    <span id="timer-main">00:00:00</span><span id="timer-centis">.00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btn-playpause" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn" id="btn-reset"     onclick="resetTimer()">↻</button>
  </div>

  <div class="set-time">
    <input type="text" id="time-input" placeholder="HH:MM:SS" maxlength="8">
    <button class="set-btn" onclick="setTimeFromInput()">Set</button>
  </div>
</div>

<div id="bottombar">
  <div class="size-group">
    <button class="size-btn" onclick="changeSize(-4)">−</button>
    <button class="size-btn" onclick="changeSize(4)">+</button>
  </div>
  <div id="conn-status" class="disconnected">○ No device</div>
  <div style="width:40px;flex-shrink:0;"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
var centiseconds = 0;
var intervalId   = null;
var isRunning    = false;
var fontSize     = 52;
var fontSizeSub  = Math.round(fontSize * 0.58);

var dispMain   = document.getElementById('timer-main');
var dispCentis = document.getElementById('timer-centis');
var dispWrap   = document.getElementById('timer-display');
var btnPlay    = document.getElementById('btn-playpause');
var connStatus = document.getElementById('conn-status');

// ── URL params ────────────────────────────────────────────────────────────────
var p      = new URLSearchParams(window.location.search);
var wsHost = p.get('wshost') || p.get('host') || localStorage.getItem('alttp-ws-host') || 'localhost';
var wsPort = p.get('wsport') || p.get('port') || localStorage.getItem('alttp-ws-port') || '23074';

// Apply chosen timer color
var TIMER_COLORS = {
  blue:   { main: '#3498db', dim: '#2a7ab8' },
  green:  { main: '#2ecc71', dim: '#27ae60' },
  red:    { main: '#b20d1d', dim: '#cd1325' },
  orange: { main: '#d36a0f', dim: '#eb7611' },
  purple: { main: '#7c13cd', dim: '#8914e3' },
  yellow: { main: '#ffd700', dim: '#c8a800' },
  pink:   { main: '#e314d2', dim: '#eb11d9' },
};
var colorKey = p.get('color') || 'blue';
var tc = TIMER_COLORS[colorKey] || TIMER_COLORS.blue;
document.documentElement.style.setProperty('--timer-color',     tc.main);
document.documentElement.style.setProperty('--timer-color-dim', tc.dim);

// Apply background
var bgKey = p.get('bg') || 'black';
if (bgKey !== 'black') {
  document.documentElement.setAttribute('data-bg', bgKey);
}

// ── Font size controls ────────────────────────────────────────────────────────
function changeSize(delta) {
  fontSize = Math.max(20, Math.min(120, fontSize + delta));
  fontSizeSub = Math.round(fontSize * 0.58);
  dispMain.style.fontSize   = fontSize + 'px';
  dispCentis.style.fontSize = fontSizeSub + 'px';
}

// ── Formatting ────────────────────────────────────────────────────────────────
function formatTime(cs) {
  var neg = cs < 0;
  var abs = Math.abs(cs);
  var h = Math.floor(abs / 360000);
  var m = Math.floor((abs % 360000) / 6000);
  var s = Math.floor((abs % 6000) / 100);
  var c = abs % 100;
  var main = (neg ? '-' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
  return { main: main, centis: '.' + pad(c) };
}
function pad(n) { return String(Math.abs(n)).padStart(2, '0'); }

function updateDisplay() {
  var t = formatTime(centiseconds);
  dispMain.textContent   = t.main;
  dispCentis.textContent = t.centis;
}

// ── Timer controls ────────────────────────────────────────────────────────────
function startTimer() {
  if (isRunning) return;
  isRunning  = true;
  intervalId = setInterval(function() { centiseconds++; updateDisplay(); }, 10);
  btnPlay.textContent = '⏸';
  btnPlay.className   = 'ctrl-btn running';
  dispWrap.className  = 'timer-display running';
}

function stopTimer() {
  if (!isRunning) return;
  isRunning = false;
  clearInterval(intervalId);
  btnPlay.textContent = '▶';
  btnPlay.className   = 'ctrl-btn';
}

function finishTimer() {
  stopTimer();
  dispWrap.className = 'timer-display finished';
}

function togglePlayPause() {
  if (isRunning) stopTimer(); else startTimer();
}

function resetTimer() {
  stopTimer();
  centiseconds = 0;
  updateDisplay();
  dispWrap.className = 'timer-display';
}

function setTimeFromInput() {
  var val = document.getElementById('time-input').value.trim();
  var neg = val.charAt(0) === '-';
  if (neg) val = val.slice(1);
  var parts = val.split(':').map(function(x) { return parseInt(x) || 0; });
  var h = 0, m = 0, s = 0;
  if (parts.length === 3)      { h = parts[0]; m = parts[1]; s = parts[2]; }
  else if (parts.length === 2) { m = parts[0]; s = parts[1]; }
  else                         { s = parts[0]; }
  centiseconds = (h * 3600 + m * 60 + s) * 100 * (neg ? -1 : 1);
  updateDisplay();
  document.getElementById('time-input').value = '';
}

document.getElementById('time-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') setTimeFromInput();
});

// ── WebSocket ─────────────────────────────────────────────────────────────────
var _ws             = null;
var _reconnectTimer = null;
var _deviceAttached = false;
var _pendingRead    = false;
var _pollTimer      = null;
var _validReadCount = 0;     // counts consecutive valid gameplay reads
var _zeroReadCount  = 0;     // counts consecutive garbage reads
var ZERO_READ_LIMIT = 20;    // garbage reads before re-validating (~5s at 250ms)

var _lastGamemode   = -1;
var _triforceCount  = 0;
var TRIFORCE_CONFIRM = 2;
var GAMEMODE_SRAM   = 'F50010';
var GAMEPLAY_MODES  = [0x07, 0x09, 0x0B];
var TRIFORCE_MODE   = 0x19;

// Known non-gameplay ALTTP modes — startup, menus, cutscenes etc.
// Seeing these means the game is loading/in menus, NOT garbage data
var KNOWN_MODES = [
  0x00, // Startup / boot
  0x01, // File select init
  0x02, // Copy / erase file select
  0x03, // Intro / title sequence
  0x04, // Title screen
  0x05, // File select
  0x06, // Agahnim intro cutscene
  0x08, // Opening sequence
  0x0A, // Special transition
  0x0C, // Game over
  0x0D, // Boss death
  0x0E, // Item get screen
  0x0F, // Attract mode / demo
  0x10, // Credits
  0x14, // Inventory screen
  0x16, // Save and quit
  0x17, // Pause screen
  0x18, // Death sequence
  0x19, // Triforce room (handled separately)
  0x1A, // Victory
  0x1B, // Game ending
];

function setConnStatus(text, cls) {
  connStatus.textContent = text;
  connStatus.className   = cls;
}

function connect() {
  if (_ws) { try { _ws.close(); } catch(e) {} _ws = null; }
  setConnStatus('○ Connecting…', 'connecting');
  try {
    _ws = new WebSocket('ws://' + wsHost + ':' + wsPort);
    _ws.binaryType = 'arraybuffer';
    _ws.onopen  = function() {
      setConnStatus('○ Connecting…', 'connecting');
      _ws.send(JSON.stringify({ Opcode: 'DeviceList', Space: 'SNES' }));
    };
    _ws.onmessage = handleMessage;
    _ws.onerror   = function() { setConnStatus('○ Error', 'disconnected'); scheduleReconnect(); };
    _ws.onclose   = function() {
      _deviceAttached = false;
      _pendingRead    = false;
      _validReadCount = 0;
      _zeroReadCount  = 0;
      _triforceCount  = 0;
      clearInterval(_pollTimer);
      _pollTimer = null;
      setConnStatus('○ Disconnected', 'disconnected');
      scheduleReconnect();
    };
  } catch(e) { scheduleReconnect(); }
}

function scheduleReconnect() {
  clearTimeout(_reconnectTimer);
  _reconnectTimer = setTimeout(connect, 5000);
}

function handleMessage(evt) {
  try {
    if (evt.data instanceof ArrayBuffer) {
      if (_pendingRead) {
        _pendingRead = false;
        var gm = new Uint8Array(evt.data)[0];
        if (GAMEPLAY_MODES.indexOf(gm) !== -1) {
          // In-game — start timer
          _triforceCount = 0;
          _zeroReadCount = 0;
          _validReadCount++;
          if (_validReadCount === 1) {
            // First confirmed gameplay read — slow down polling
            clearInterval(_pollTimer);
            _pollTimer = setInterval(pollGamemode, 500);
          }
          startTimer();
        } else if (gm === TRIFORCE_MODE) {
          _triforceCount++;
          _zeroReadCount = 0;
          _validReadCount++;
          if (_validReadCount === 1) {
            clearInterval(_pollTimer);
            _pollTimer = setInterval(pollGamemode, 500);
          }
          if (_triforceCount >= TRIFORCE_CONFIRM) finishTimer();
        } else if (KNOWN_MODES.indexOf(gm) !== -1) {
          // Known pre-game / menu mode — game is loading, just wait
          _triforceCount = 0;
          _zeroReadCount = 0;
        } else {
          // Truly unknown value — likely garbage from RetroArch before game loads
          _triforceCount = 0;
          if (_validReadCount === 0) {
            // Only count garbage before we've seen any valid gameplay
            _zeroReadCount++;
            if (_zeroReadCount >= ZERO_READ_LIMIT) {
              _zeroReadCount = 0;
              _validReadCount = 0;
              _triforceCount = 0;
              _deviceAttached = false;
              _pendingRead = false;
              clearInterval(_pollTimer);
              _pollTimer = null;
              setConnStatus('○ Waiting for game…', 'connecting');
              setTimeout(function() {
                if (_ws && _ws.readyState === WebSocket.OPEN) {
                  _ws.send(JSON.stringify({ Opcode: 'DeviceList', Space: 'SNES' }));
                }
              }, 1000);
            }
          }
        }
        _lastGamemode = gm;
      }
      return;
    }
    var r = JSON.parse(evt.data);
    if (r.Results && Array.isArray(r.Results)) {
      if (!r.Results.length) {
        setConnStatus('○ No device', 'disconnected');
        setTimeout(function() {
          _ws.send(JSON.stringify({ Opcode: 'DeviceList', Space: 'SNES' }));
        }, 3000);
        return;
      }
      _ws.send(JSON.stringify({ Opcode: 'Attach', Space: 'SNES', Operands: [r.Results[0]] }));
      setConnStatus('● Connected', 'connected');
      _deviceAttached = true;
      _pendingRead    = false;  // clear any stuck pending read from previous session
      _zeroReadCount  = 0;
      _validReadCount = 0;
      _triforceCount  = 0;
      clearInterval(_pollTimer);
      // Start fast (250ms) to catch game start quickly, slow down after first valid read
      _pollTimer = setInterval(pollGamemode, 250);
    }
  } catch(e) {}
}

function pollGamemode() {
  if (!_ws || _ws.readyState !== WebSocket.OPEN || !_deviceAttached || _pendingRead) return;
  _pendingRead = true;
  _ws.send(JSON.stringify({ Opcode: 'GetAddress', Space: 'SNES', Operands: [GAMEMODE_SRAM, '01'] }));
}

window.addEventListener('load', function() { connect(); });
</script>
</body>
</html>
