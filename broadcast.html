<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALTTP Broadcast View</title>
<script>
// Set data-bg (and image CSS var) as early as possible so the chosen bg
// doesn't flash before the main script runs.
(function(){
  try {
    var p = new URLSearchParams(window.location.search);
    var bg = p.get('bg') || localStorage.getItem('alttp-broadcast-bg') || 'black';
    var bgImage = localStorage.getItem('alttp-broadcast-bg-image') || '';
    if (bg === 'image' && !bgImage) bg = 'black';
    document.documentElement.setAttribute('data-bg', bg);
    if (bg === 'image' && bgImage) {
      document.documentElement.style.setProperty('--bg-image', 'url("' + bgImage + '")');
    }
  } catch(e) {}
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #000;
  width: 100%; height: 100%;
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* Background themes */
[data-bg="grey"]        body, body[data-bg="grey"]        { background: #333 !important; }
[data-bg="white"]       body, body[data-bg="white"]       { background: #fff !important; }
[data-bg="transparent"] body, body[data-bg="transparent"] { background: transparent !important; }

/* Transparent mode — push content down so it doesn't sit under macOS traffic
   lights / Windows caption buttons, and provide a drag strip up top. */
html[data-bg="transparent"] body {
  padding-top: 30px;
}
html[data-bg="transparent"] body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 140px;
  height: 30px;
  -webkit-app-region: drag;
  z-index: 9999;
}
html[data-bg="transparent"] .bbg-bar {
  -webkit-app-region: drag;
  background: rgba(0,0,0,0.6) !important;
  border-top-color: rgba(255,255,255,0.2) !important;
}
html[data-bg="transparent"] .bbg-bar * {
  -webkit-app-region: no-drag;
}

.broadcast-container {
  background: inherit;
  padding: 8px 6px 2px 8px;
  display: flex; flex-direction: column; gap: 2px;
  flex: 1; overflow: hidden;
}

/* Image-mode background — driven by --bg-image set from JS */
[data-bg="image"] body, body[data-bg="image"] {
  background-color: #000 !important;
  background-image: var(--bg-image, none) !important;
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
}
.bcast-row { display: flex; flex-direction: row; gap: 2px; align-items: center; }

/* Item slots ------------------------------------------------------------- */
.bslot {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.bslot img { width: 36px; height: 36px; image-rendering: pixelated; image-rendering: crisp-edges; position: relative; z-index: 2; }
.bslot::before {
  content: '';
  position: absolute; inset: 2px;
  border-radius: 4px;
  background: var(--item-fill-color, #2ecc71);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}
.bslot.filled::before { opacity: 0.7; }

/* Effects: applied only on the transition INTO the filled state.
   "Starburst" — uniform fade-in that reads as a soft burst of color.
   "No Effect" — radial mask that closes from the edges inward.
   Both intentionally slow so the change is dramatic on a stream. */
.bslot.filled.fx-falling::before { animation: fx-falling 0.6s ease-out; }
.bslot.filled.fx-fade::before    { animation: fx-fade    0.9s ease-out; }
.bslot.filled.fx-edges::before   { animation: fx-edges   1.0s ease-in;  }

@keyframes fx-falling {
  from { transform: translateY(-100%); opacity: 0.7; }
  to   { transform: translateY(0);     opacity: 0.7; }
}
@keyframes fx-fade {
  from { opacity: 0; }
  to   { opacity: 0.7; }
}

/* fx-edges: mask shrinks from edges inward.
   Driven by a registered custom property so the percentage animates smoothly. */
@property --edges-reveal {
  syntax: '<percentage>';
  initial-value: 0%;
  inherits: false;
}
.bslot.filled.fx-edges::before,
.bslot-bottles.filled.fx-edges::before,
.bright-slot.bslot-icon.filled.fx-edges::before {
  -webkit-mask-image: radial-gradient(circle at 50% 50%,
    transparent calc(var(--edges-reveal, 0%) - 0.5%),
    #000        var(--edges-reveal, 0%));
          mask-image: radial-gradient(circle at 50% 50%,
    transparent calc(var(--edges-reveal, 0%) - 0.5%),
    #000        var(--edges-reveal, 0%));
}
@keyframes fx-edges {
  from { --edges-reveal: 80%; opacity: 0.7; }
  to   { --edges-reveal: 0%;  opacity: 0.7; }
}

.bmed-label {
  position: absolute; bottom: 1px; right: 1px;
  font-size: 10px; font-weight: bold; color: #fff; text-transform: uppercase;
  text-shadow: 0 0 2px #000, 0 0 2px #000;
  z-index: 3;
}

.bslot-bottles {
  width: 40px; height: 40px;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: 1px; flex-shrink: 0;
  position: relative;
}
.bslot-bottles::before {
  content: '';
  position: absolute; inset: 1px;
  border-radius: 4px;
  background: var(--item-fill-color, #2ecc71);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}
.bslot-bottles.filled::before { opacity: 0.7; }
.bslot-bottles.filled.fx-falling::before { animation: fx-falling 0.6s ease-out; }
.bslot-bottles.filled.fx-fade::before    { animation: fx-fade    0.9s ease-out; }
.bslot-bottles.filled.fx-edges::before   { animation: fx-edges   1.0s ease-in;  }
.bminibottle { display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; }
.bminibottle img { width: 18px; height: 18px; image-rendering: pixelated; }

/* Right-column: agahnim / gomode / stats — wider so they line up vertically */
.bright-slot {
  width: 82px; height: 40px;
  display: flex; align-items: center; justify-content: flex-start;
  position: relative; flex-shrink: 0;
  padding-left: 6px;
}
.bright-slot.bslot-icon img { width: 36px; height: 36px; image-rendering: pixelated; position: relative; z-index: 2; }
.bright-slot.bslot-icon::before {
  content: '';
  position: absolute; left: 6px; top: 2px; width: 36px; bottom: 2px;
  border-radius: 4px;
  background: var(--item-fill-color, #2ecc71);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}
.bright-slot.bslot-icon.filled::before { opacity: 0.7; }
.bright-slot.bslot-icon.filled.fx-falling::before { animation: fx-falling 0.6s ease-out; }
.bright-slot.bslot-icon.filled.fx-fade::before    { animation: fx-fade    0.9s ease-out; }
.bright-slot.bslot-icon.filled.fx-edges::before   { animation: fx-edges   1.0s ease-in;  }

/* Go Mode (right-column) */
.bgo-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: bold; font-family: Arial, sans-serif;
  color: #666; background: transparent;
  transition: background 0.15s, color 0.15s;
}
.bgo-btn.on      { color: #2ecc71; background: #2ecc71; color: #000; }
.bgo-btn.feeling { color: #eee600; background: #eee600; color: #000; }

/* Stats — fixed width labels so numbers align */
.bstats-slot {
  width: 82px; height: 40px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  gap: 1px; padding-left: 4px;
  flex-shrink: 0;
}
.bstat-row { display: flex; align-items: center; gap: 6px; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
.bstat-label { color: #888; width: 32px; flex-shrink: 0; }
.bstat-check { color: #4dff88; }
.bstat-death { color: #ff4444; }
.bstat-bonk  { color: #ffa500; }

/* Dungeon slot — item-tracker style ------------------------------------- */
.bdng-slot {
  background: #111; border: 1px solid #2a2a2a; border-radius: 4px;
  padding: 3px 2px;
  display: flex; flex-direction: column;
  align-items: center; gap: 2px; flex-shrink: 0;
  width: 46px;
  transition: background 0.3s, border-color 0.3s;
}
/* "Dungeon Box" toggle — strip the default container so dungeons look like
   the items around them. Defined BEFORE the state classes so chests-done /
   prize-done still take effect (their tints override "no box"). */
.bdng-slot.no-box {
  background: transparent;
  border-color: transparent;
}
.bdng-slot.chests-done {
  background: color-mix(in srgb, var(--chests-color, #5a8eff) 35%, #000);
  border-color: var(--chests-color, #5a8eff);
}
.bdng-slot.prize-done {
  background: color-mix(in srgb, var(--complete-color, #4dff88) 35%, #000);
  border-color: var(--complete-color, #4dff88);
}
.bdng-slot.pendant     { border-color: #2e8b57; }

/* Classic view dungeon slot — compact: just the label + prize.
   Big-key / map / compass / small-key / chests rows are all hidden. */
.bdng-slot.classic {
  width: 40px;
  padding: 2px;
  gap: 1px;
  justify-content: center;
}
.bdng-slot.classic .bdng-icons,
.bdng-slot.classic .bdng-keys-row,
.bdng-slot.classic .bdng-chests-row,
.bdng-slot.classic .bdng-bigkey-top { display: none; }
.bdng-slot.classic .bdng-name { font-size: 10px; line-height: 1.1; }
.bdng-slot.classic .bdng-prize { width: 18px; height: 18px; }
.bdng-slot.classic .bdng-top { gap: 0; }

/* Label centered on its own row */
.bdng-name {
  font-family: Arial, sans-serif; font-size: 10px; font-weight: bold;
  color: #ccc; line-height: 1;
  text-align: center;
  width: 100%;
}

/* All icon/value rows are centered horizontally */
.bdng-top,
.bdng-icons,
.bdng-row {
  display: flex; flex-direction: row; align-items: center;
  justify-content: center; gap: 2px;
}

/* Prize + big key row (under the label) */
.bdng-top img {
  width: 12px; height: 12px;
  image-rendering: pixelated;
}

/* Map + compass row */
.bdng-icons img {
  width: 12px; height: 12px;
  image-rendering: pixelated;
}

/* Small keys / chests rows */
.bdng-row img {
  width: 10px; height: 10px;
  image-rendering: pixelated;
}
.bdng-row span {
  font-family: Arial, sans-serif; font-size: 8px; color: #ccc;
  line-height: 1;
}
.bdng-row .bdng-keys.full   { color: #2ecc71; }
.bdng-row .bdng-chests.full { color: #2ecc71; }

/* Bottom bar with Settings ---------------------------------------------- */
.bbg-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  background: #111;
  border-top: 1px solid #222;
  flex-shrink: 0;
  position: sticky; bottom: 0; width: 100%;
}
.bsettings-btn {
  font-family: Arial, sans-serif; font-size: 10px; color: #ccc;
  background: #1a1a1a; border: 1px solid #444; border-radius: 3px;
  padding: 2px 8px; cursor: pointer; outline: none;
  display: inline-flex; align-items: center; gap: 4px;
}
.bsettings-btn:hover { border-color: #4dff88; color: #fff; }

/* Settings modal -------------------------------------------------------- */
#settings-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000;
}
#settings-overlay.hidden { display: none; }
.settings-modal {
  background: #1a1a1a;
  border: 1px solid #444;
  border-radius: 6px;
  width: 320px; max-width: 92%;
  max-height: 90%;
  overflow-y: auto;
  font-family: Arial, sans-serif; color: #ddd;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid #333;
}
.settings-header h3 { font-size: 13px; color: #fff; margin: 0; }
.settings-close {
  background: transparent; border: none; color: #888; font-size: 18px;
  cursor: pointer; line-height: 1; padding: 0 4px;
}
.settings-close:hover { color: #fff; }
.settings-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.settings-section { display: flex; flex-direction: column; gap: 6px; }
.settings-section > h4 {
  font-size: 11px; color: #4dff88; text-transform: uppercase;
  letter-spacing: 0.5px; font-weight: bold; margin: 0;
}
.settings-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
}
.settings-row label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.settings-row input[type="radio"], .settings-row input[type="checkbox"] {
  margin: 0; cursor: pointer;
}
.settings-radios {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.settings-sub {
  margin-left: 18px; padding-left: 10px;
  border-left: 1px solid #333;
  display: flex; flex-direction: column; gap: 6px;
}
.settings-sub.disabled { opacity: 0.4; pointer-events: none; }
.settings-sub > .sub-label {
  font-size: 10px; color: #888; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.settings-color-picker {
  width: 28px; height: 18px; padding: 0; border: 1px solid #444;
  background: transparent; cursor: pointer;
}
.settings-select {
  font-family: Arial, sans-serif; font-size: 11px; color: #ccc;
  background: #2a2a2a; border: 1px solid #444; border-radius: 3px;
  padding: 2px 6px; cursor: pointer; outline: none;
}
</style>
</head>
<body>
<div class="broadcast-container">
  <div class="bcast-row" id="row1"></div>
  <div class="bcast-row" id="row2"></div>
  <div class="bcast-row" id="row3"></div>
  <div class="bcast-row" id="row4"></div>
</div>
<div class="bbg-bar">
  <button class="bsettings-btn" onclick="openSettings()">⚙ Settings</button>
</div>

<div id="settings-overlay" class="hidden" onclick="if(event.target===this)closeSettings()">
  <div class="settings-modal">
    <div class="settings-header">
      <h3>Broadcast Settings</h3>
      <button class="settings-close" onclick="closeSettings()">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h4>Main Background</h4>
        <div class="settings-radios" id="bg-radios">
          <label><input type="radio" name="bg" value="black"> Black</label>
          <label><input type="radio" name="bg" value="grey"> Grey</label>
          <label><input type="radio" name="bg" value="white"> White</label>
          <label><input type="radio" name="bg" value="transparent"> Transparent</label>
          <label><input type="radio" name="bg" value="image"> Image</label>
        </div>
        <div class="settings-row">
          <label class="bsettings-btn" style="cursor:pointer; margin:0;">
            Choose Image...
            <input type="file" accept="image/*" id="opt-bg-image-file" style="display:none;">
          </label>
          <button type="button" class="bsettings-btn" id="opt-bg-image-clear" style="margin:0;">Clear</button>
          <span class="sub-label" id="bg-image-status" style="font-size:10px;color:#888;">No image</span>
        </div>
      </div>

      <div class="settings-section">
        <h4>Item Background</h4>
        <div class="settings-row">
          <label><input type="checkbox" id="opt-fill-enabled"> Item Fill</label>
        </div>
        <div class="settings-sub" id="fill-sub">
          <div class="sub-label">Fill Color</div>
          <div class="settings-radios">
            <label><input type="radio" name="fill-color" value="green"> Green</label>
            <label><input type="radio" name="fill-color" value="blue"> Blue</label>
            <label><input type="radio" name="fill-color" value="purple"> Purple</label>
            <label><input type="radio" name="fill-color" value="custom"> Custom</label>
            <input type="color" class="settings-color-picker" id="opt-fill-custom" value="#00aa00">
          </div>
          <div class="sub-label">Fill Effect</div>
          <div class="settings-radios">
            <label><input type="radio" name="fill-effect" value="none"> No Effects</label>
            <label><input type="radio" name="fill-effect" value="falling"> Falling</label>
            <label><input type="radio" name="fill-effect" value="starburst"> Starburst</label>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h4>View Style</h4>
        <div class="settings-radios">
          <label><input type="radio" name="view-style" value="modern"> Modern</label>
          <label><input type="radio" name="view-style" value="classic"> Classic</label>
        </div>
      </div>

      <div class="settings-section">
        <h4>Dungeon Background</h4>
        <div class="settings-row">
          <label><input type="checkbox" id="opt-dungeon-fill"> Dungeon Fill</label>
          <label><input type="checkbox" id="opt-dungeon-box"> Dungeon Box</label>
        </div>
        <div class="sub-label">All Chests Collected</div>
        <div class="settings-radios">
          <label><input type="radio" name="chests-color" value="blue"> Blue</label>
          <label><input type="radio" name="chests-color" value="green"> Green</label>
          <label><input type="radio" name="chests-color" value="purple"> Purple</label>
          <label><input type="radio" name="chests-color" value="yellow"> Yellow</label>
          <label><input type="radio" name="chests-color" value="custom"> Custom</label>
          <input type="color" class="settings-color-picker" id="opt-chests-custom" value="#5a8eff">
        </div>
        <div class="sub-label">Dungeon Complete</div>
        <div class="settings-radios">
          <label><input type="radio" name="complete-color" value="green"> Green</label>
          <label><input type="radio" name="complete-color" value="blue"> Blue</label>
          <label><input type="radio" name="complete-color" value="purple"> Purple</label>
          <label><input type="radio" name="complete-color" value="yellow"> Yellow</label>
          <label><input type="radio" name="complete-color" value="custom"> Custom</label>
          <input type="color" class="settings-color-picker" id="opt-complete-custom" value="#4dff88">
        </div>
      </div>

      <div class="settings-section">
        <h4>Dungeon Items</h4>
        <div class="settings-radios">
          <label><input type="checkbox" id="opt-show-map">        Map</label>
          <label><input type="checkbox" id="opt-show-compass">    Compass</label>
          <label><input type="checkbox" id="opt-show-smallkeys">  Small Keys</label>
          <label><input type="checkbox" id="opt-show-bigkey">     Big Key</label>
          <label><input type="checkbox" id="opt-show-chests">     Chests</label>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Settings storage ─────────────────────────────────────────────────────
var SETTINGS = {
  bg:           'black',
  bgImage:      '',          // data: URL of uploaded background image
  fillEnabled:  false,
  fillColor:    'green',     // green | blue | purple | custom
  fillCustom:   '#00aa00',
  fillEffect:   'none',      // none | falling | starburst
  chestsColor:  'blue',      // blue | green | purple | yellow | custom — All chests collected tint
  chestsCustom: '#5a8eff',
  completeColor:'green',     // green | blue | purple | yellow | custom — Dungeon complete tint
  completeCustom:'#4dff88',
  showMap:       true,
  showCompass:   true,
  showSmallKeys: true,
  showBigKey:    true,
  showChests:    true,
  dungeonFillEnabled: true, // When false the chests-done/prize-done tints are suppressed
  dungeonBoxEnabled:  true, // When false the default dark slot container is hidden — flat dungeons
  viewStyle:     'modern'   // 'modern' | 'classic'
};

var FILL_COLORS = {
  green:  '#2ecc71',
  blue:   '#3498db',
  purple: '#b675ff'
};

var DUNGEON_PRESETS = {
  blue:   '#5a8eff',
  green:  '#4dff88',
  purple: '#b675ff',
  yellow: '#ffcc44'
};

function loadSettings() {
  try {
    SETTINGS.bg            = localStorage.getItem('alttp-broadcast-bg') || SETTINGS.bg;
    SETTINGS.bgImage       = localStorage.getItem('alttp-broadcast-bg-image') || '';
    SETTINGS.fillEnabled   = localStorage.getItem('alttp-broadcast-fill-enabled') === 'true';
    SETTINGS.fillColor     = localStorage.getItem('alttp-broadcast-fill-color')   || SETTINGS.fillColor;
    SETTINGS.fillCustom    = localStorage.getItem('alttp-broadcast-fill-custom')  || SETTINGS.fillCustom;
    SETTINGS.fillEffect    = localStorage.getItem('alttp-broadcast-fill-effect')  || SETTINGS.fillEffect;
    SETTINGS.chestsColor   = localStorage.getItem('alttp-broadcast-chests-color') || SETTINGS.chestsColor;
    SETTINGS.chestsCustom  = localStorage.getItem('alttp-broadcast-chests-custom')|| SETTINGS.chestsCustom;
    SETTINGS.completeColor = localStorage.getItem('alttp-broadcast-complete-color') || SETTINGS.completeColor;
    SETTINGS.completeCustom= localStorage.getItem('alttp-broadcast-complete-custom')|| SETTINGS.completeCustom;
    // Default-on flags use !== 'false' so first-run / never-set means visible
    SETTINGS.showMap       = localStorage.getItem('alttp-broadcast-show-map')        !== 'false';
    SETTINGS.showCompass   = localStorage.getItem('alttp-broadcast-show-compass')    !== 'false';
    SETTINGS.showSmallKeys = localStorage.getItem('alttp-broadcast-show-smallkeys')  !== 'false';
    SETTINGS.showBigKey    = localStorage.getItem('alttp-broadcast-show-bigkey')     !== 'false';
    SETTINGS.showChests    = localStorage.getItem('alttp-broadcast-show-chests')     !== 'false';
    SETTINGS.dungeonFillEnabled = localStorage.getItem('alttp-broadcast-dungeon-fill') !== 'false';
    SETTINGS.dungeonBoxEnabled  = localStorage.getItem('alttp-broadcast-dungeon-box')  !== 'false';
    SETTINGS.viewStyle     = localStorage.getItem('alttp-broadcast-view-style')      || SETTINGS.viewStyle;
  } catch (e) {}
  // URL bg overrides stored bg
  var p = new URLSearchParams(window.location.search);
  var urlBg = p.get('bg');
  if (urlBg) SETTINGS.bg = urlBg;
  // Fall back to black if "image" is selected but we have no stored image
  if (SETTINGS.bg === 'image' && !SETTINGS.bgImage) SETTINGS.bg = 'black';
}

function saveSettings() {
  try {
    localStorage.setItem('alttp-broadcast-bg',             SETTINGS.bg);
    localStorage.setItem('alttp-broadcast-fill-enabled',   SETTINGS.fillEnabled ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-fill-color',     SETTINGS.fillColor);
    localStorage.setItem('alttp-broadcast-fill-custom',    SETTINGS.fillCustom);
    localStorage.setItem('alttp-broadcast-fill-effect',    SETTINGS.fillEffect);
    localStorage.setItem('alttp-broadcast-chests-color',   SETTINGS.chestsColor);
    localStorage.setItem('alttp-broadcast-chests-custom',  SETTINGS.chestsCustom);
    localStorage.setItem('alttp-broadcast-complete-color', SETTINGS.completeColor);
    localStorage.setItem('alttp-broadcast-complete-custom',SETTINGS.completeCustom);
    localStorage.setItem('alttp-broadcast-show-map',        SETTINGS.showMap       ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-show-compass',    SETTINGS.showCompass   ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-show-smallkeys',  SETTINGS.showSmallKeys ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-show-bigkey',     SETTINGS.showBigKey    ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-show-chests',     SETTINGS.showChests    ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-dungeon-fill',    SETTINGS.dungeonFillEnabled ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-dungeon-box',     SETTINGS.dungeonBoxEnabled  ? 'true' : 'false');
    localStorage.setItem('alttp-broadcast-view-style',      SETTINGS.viewStyle);
  } catch (e) {}
}

function saveBgImage(dataUrl) {
  SETTINGS.bgImage = dataUrl || '';
  try {
    if (dataUrl) localStorage.setItem('alttp-broadcast-bg-image', dataUrl);
    else         localStorage.removeItem('alttp-broadcast-bg-image');
    return true;
  } catch (e) {
    alert('Could not store background image — it may be too large. Try a smaller file.');
    SETTINGS.bgImage = '';
    return false;
  }
}

function applyFillVariable() {
  var color = SETTINGS.fillColor === 'custom' ? SETTINGS.fillCustom : (FILL_COLORS[SETTINGS.fillColor] || FILL_COLORS.green);
  document.documentElement.style.setProperty('--item-fill-color', color);
}

// Re-evaluates the small-key row's display state for one dungeon. Combines the
// per-dungeon "this dungeon has no keys" check (which hides via visibility so
// rows stay aligned) with the user-level "Small Keys" toggle (which hides via
// display so the slot collapses entirely).
function applyKeyRowDisplay(d) {
  if (!d || !d.keyRow) return;
  if (!SETTINGS.showSmallKeys) {
    d.keyRow.style.display = 'none';
  } else {
    d.keyRow.style.display = '';
    d.keyRow.style.visibility = ((d._maxSmallKeys || 0) > 0) ? 'visible' : 'hidden';
  }
}

function applyDungeonVisibility() {
  Object.keys(dngEls).forEach(function(key) {
    var d = dngEls[key]; if (!d) return;
    d.map.style.display     = SETTINGS.showMap     ? '' : 'none';
    d.compass.style.display = SETTINGS.showCompass ? '' : 'none';
    d.bigkey.style.display  = SETTINGS.showBigKey  ? '' : 'none';
    // Hide the icons row entirely if both map AND compass are hidden
    d.iconsRow.style.display = (SETTINGS.showMap || SETTINGS.showCompass) ? '' : 'none';
    d.chestRow.style.display = SETTINGS.showChests ? '' : 'none';
    applyKeyRowDisplay(d);
  });
}

// Toggle the default container (background + border) on every dungeon slot.
function applyDungeonBox() {
  Object.keys(dngEls).forEach(function(key) {
    var d = dngEls[key]; if (!d) return;
    d.slot.classList.toggle('no-box', !SETTINGS.dungeonBoxEnabled);
  });
}

// Re-evaluate the chests-done / prize-done classes from the current DOM state.
// Called when the user toggles "Dungeon Fill" so the visual updates without
// waiting for the next snap.
function applyDungeonFill() {
  Object.keys(dngEls).forEach(function(key) {
    var d = dngEls[key]; if (!d) return;
    var parts = (d.chestVal.textContent || '0/0').split('/');
    var c = parseInt(parts[0]) || 0;
    var m = parseInt(parts[1]) || 0;
    var allChests = c >= m && m > 0;
    var prizeDone = (d.prize.src || '').indexOf('1.png') !== -1;
    var fillOn   = SETTINGS.dungeonFillEnabled;
    d.slot.classList.toggle('prize-done',  fillOn && allChests && prizeDone);
    d.slot.classList.toggle('chests-done', fillOn && allChests && !prizeDone);
  });
}

function applyDungeonColors() {
  var chests   = SETTINGS.chestsColor   === 'custom' ? SETTINGS.chestsCustom   : (DUNGEON_PRESETS[SETTINGS.chestsColor]   || DUNGEON_PRESETS.blue);
  var complete = SETTINGS.completeColor === 'custom' ? SETTINGS.completeCustom : (DUNGEON_PRESETS[SETTINGS.completeColor] || DUNGEON_PRESETS.green);
  document.documentElement.style.setProperty('--chests-color',   chests);
  document.documentElement.style.setProperty('--complete-color', complete);
}

function applyBg(bg) {
  // If "image" was chosen but no image is stored, prompt to upload first.
  if (bg === 'image' && !SETTINGS.bgImage) {
    var picker = document.getElementById('opt-bg-image-file');
    if (picker) picker.click();
    // Re-select the previous bg in the radios
    document.querySelectorAll('input[name="bg"]').forEach(function(r){ r.checked = (r.value === SETTINGS.bg); });
    return;
  }

  SETTINGS.bg = bg;
  saveSettings();

  document.documentElement.setAttribute('data-bg', bg);
  document.body.setAttribute('data-bg', bg);

  if (bg === 'transparent') {
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
    document.body.style.backgroundColor = 'transparent';
    document.body.style.backgroundImage = 'none';
  } else if (bg === 'image') {
    document.documentElement.style.setProperty('--bg-image', SETTINGS.bgImage ? 'url("' + SETTINGS.bgImage + '")' : 'none');
    // Inline styles cleared so the [data-bg=image] rule can take over
    document.body.style.background = '';
    document.documentElement.style.background = '';
    document.body.style.backgroundColor = '';
    document.body.style.backgroundImage = '';
  } else {
    var bgMap = { black:'#000000', grey:'#333333', white:'#ffffff' };
    var color = bgMap[bg] || '#000000';
    document.body.style.background = color;
    document.documentElement.style.background = color;
    document.body.style.backgroundColor = color;
    document.body.style.backgroundImage = 'none';
  }

  if (window.electronAPI && window.electronAPI.setBroadcastBg) window.electronAPI.setBroadcastBg(bg);
}

function updateBgImageStatus() {
  var lbl = document.getElementById('bg-image-status');
  if (lbl) lbl.textContent = SETTINGS.bgImage ? 'Image loaded' : 'No image';
}

  document.getElementById('opt-show-compass').checked   = SETTINGS.showCompass;
  document.getElementById('opt-show-smallkeys').checked = SETTINGS.showSmallKeys;
  document.getElementById('opt-show-bigkey').checked    = SETTINGS.showBigKey;
  document.getElementById('opt-show-chests').checked    = SETTINGS.showChests;
  document.getElementById('opt-dungeon-fill').checked   = SETTINGS.dungeonFillEnabled;
  document.getElementById('opt-dungeon-box').checked    = SETTINGS.dungeonBoxEnabled;
  document.querySelectorAll('input[name="view-style"]').forEach(function(r) { r.checked = (r.value === SETTINGS.viewStyle); });

function closeSettings() {
  document.getElementById('settings-overlay').classList.add('hidden');
}
function syncFillSubEnabled() {
  var sub = document.getElementById('fill-sub');
  if (SETTINGS.fillEnabled) sub.classList.remove('disabled');
  else                       sub.classList.add('disabled');
}

function wireSettingsHandlers() {
  document.querySelectorAll('input[name="bg"]').forEach(function(r) {
    r.addEventListener('change', function() { if (r.checked) applyBg(r.value); });
  });
  document.getElementById('opt-fill-enabled').addEventListener('change', function(e) {
    SETTINGS.fillEnabled = e.target.checked;
    saveSettings(); syncFillSubEnabled(); refreshAllFills();
  });
  document.querySelectorAll('input[name="fill-color"]').forEach(function(r) {
    r.addEventListener('change', function() {
      if (!r.checked) return;
      SETTINGS.fillColor = r.value;
      saveSettings(); applyFillVariable();
    });
  });
  document.getElementById('opt-fill-custom').addEventListener('input', function(e) {
    SETTINGS.fillCustom = e.target.value;
    if (SETTINGS.fillColor === 'custom') applyFillVariable();
    saveSettings();
  });
  document.querySelectorAll('input[name="fill-effect"]').forEach(function(r) {
    r.addEventListener('change', function() {
      if (!r.checked) return;
      SETTINGS.fillEffect = r.value;
      saveSettings();
    });
  });

  // Dungeon Background — All Chests Collected
  document.querySelectorAll('input[name="chests-color"]').forEach(function(r) {
    r.addEventListener('change', function() {
      if (!r.checked) return;
      SETTINGS.chestsColor = r.value;
      saveSettings(); applyDungeonColors();
    });
  });
  document.getElementById('opt-chests-custom').addEventListener('input', function(e) {
    SETTINGS.chestsCustom = e.target.value;
    if (SETTINGS.chestsColor === 'custom') applyDungeonColors();
    saveSettings();
  });
  // Dungeon Background — Dungeon Complete
  document.querySelectorAll('input[name="complete-color"]').forEach(function(r) {
    r.addEventListener('change', function() {
      if (!r.checked) return;
      SETTINGS.completeColor = r.value;
      saveSettings(); applyDungeonColors();
    });
  });
  document.getElementById('opt-complete-custom').addEventListener('input', function(e) {
    SETTINGS.completeCustom = e.target.value;
    if (SETTINGS.completeColor === 'custom') applyDungeonColors();
    saveSettings();
  });

  // Dungeon Items — visibility checkboxes
  [
    ['opt-show-map',       'showMap'],
    ['opt-show-compass',   'showCompass'],
    ['opt-show-smallkeys', 'showSmallKeys'],
    ['opt-show-bigkey',    'showBigKey'],
    ['opt-show-chests',    'showChests']
  ].forEach(function(pair) {
    document.getElementById(pair[0]).addEventListener('change', function(e) {
      SETTINGS[pair[1]] = e.target.checked;
      saveSettings();
      applyDungeonVisibility();
    });
  });

  // Dungeon Fill master toggle
  document.getElementById('opt-dungeon-fill').addEventListener('change', function(e) {
    SETTINGS.dungeonFillEnabled = e.target.checked;
    saveSettings();
    applyDungeonFill();
  });

  // Dungeon Box master toggle
  document.getElementById('opt-dungeon-box').addEventListener('change', function(e) {
    SETTINGS.dungeonBoxEnabled = e.target.checked;
    saveSettings();
    applyDungeonBox();
  });

  // View Style — swap Modern / Classic layout
  document.querySelectorAll('input[name="view-style"]').forEach(function(r) {
    r.addEventListener('change', function() {
      if (!r.checked) return;
      SETTINGS.viewStyle = r.value;
      saveSettings();
      rebuildRows();
    });
  });

  // Background image picker
  var fileInput = document.getElementById('opt-bg-image-file');
  if (fileInput) {
    fileInput.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        var ok = saveBgImage(reader.result);
        if (!ok) return;
        updateBgImageStatus();
        // Switch to image bg now that we have one
        applyBg('image');
        // Sync the radio selection
        document.querySelectorAll('input[name="bg"]').forEach(function(r){ r.checked = (r.value === 'image'); });
      };
      reader.onerror = function() { alert('Could not read that file.'); };
      reader.readAsDataURL(file);
      // Reset so re-selecting the same file fires change
      fileInput.value = '';
    });
  }
  var clearBtn = document.getElementById('opt-bg-image-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      saveBgImage('');
      updateBgImageStatus();
      document.documentElement.style.removeProperty('--bg-image');
      // If image was the active bg, fall back to black
      if (SETTINGS.bg === 'image') {
        applyBg('black');
        document.querySelectorAll('input[name="bg"]').forEach(function(r){ r.checked = (r.value === 'black'); });
      }
    });
  }
}

function imgSrc(key, st) {
  var arr = IMGS[key]; if (!arr) return '';
  return BASE + '/' + arr[Math.min(st||0, arr.length-1)] + '.png';
}

// Items that should NOT be filled even when their state > 0 (because state 0 is
// the player's "starting" version of the item, e.g. green tunic / no upgrade).
var FILL_SKIP_AT_ZERO_PLUS = {}; // currently empty — fill on state>0 for everything tracked

// Modern layout — current default. 10 items + 1 special right-column slot per
// row, plus a dedicated bottom row of 10 dungeons.
var MODERN_ROWS = {
  row1: ['bow','boomerang','hookshot','bomb','mushroom','powder','firerod','icerod','moonpearl','sword','agahnim'],
  row2: ['bombos','ether','quake','lamp','hammer','shovel','flute','net','gloves','shield','gomode'],
  row3: ['book','bottles','somaria','byrna','cape','mirror','halfmagic','boots','flippers','tunic','stats'],
  row4: ['ep','dp','toh','pod','sp','sw','tt','ip','mm','tr']
};

// Classic layout — 5 rows × 8 cells. Dungeon slots render in a compact
// "label + prize" form via the .bdng-slot.classic CSS modifier. Bug net,
// half magic, and the stats panel are dropped.
var CLASSIC_ROWS = {
  row1: ['bow','boomerang','hookshot','bomb','powder','gloves','sword','ep'],
  row2: ['firerod','icerod','bombos','ether','quake','boots','shield','dp'],
  row3: ['lamp','hammer','flute','book','moonpearl','flippers','tunic','toh'],
  row4: ['bottles','somaria','byrna','cape','mirror','mushroom','net','agahnim'],
  row5: ['pod','sp','sw','tt','ip','mm','tr','gomode']
};

function activeRows()    { return SETTINGS.viewStyle === 'classic' ? CLASSIC_ROWS : MODERN_ROWS; }
function isDungeonKey(k) { return ['ep','dp','toh','pod','sp','sw','tt','ip','mm','tr'].indexOf(k) !== -1; }

// Backwards-compatible aliases — JS that walks the modern arrays in applySnap,
// resetAll, refreshAllFills etc. still gets the right set.
function currentItemRows() {
  var R = activeRows();
  return [R.row1, R.row2, R.row3];
}
var ROW4 = MODERN_ROWS.row4;   // dungeons that need state-applied, regardless of layout

var state = {
  bow:0,boomerang:0,hookshot:0,bomb:0,mushroom:0,powder:0,
  firerod:0,icerod:0,moonpearl:0,sword:0,agahnim:0,
  bombos:0,ether:0,quake:0,lamp:0,hammer:0,shovel:0,
  flute:0,net:0,gloves:0,shield:0,
  book:0,bottle1:0,bottle2:0,bottle3:0,bottle4:0,
  somaria:0,byrna:0,cape:0,mirror:0,halfmagic:0,
  boots:0,flippers:0,tunic:0,gomode:0,
  mmMedallion:0,trMedallion:0,checks:0,deaths:0,bonks:0,
};

var slotEls = {};   // key -> img element (for items)
var slotContainers = {}; // key -> the .bslot/.bslot-bottles wrapper that gets .filled
var dngEls  = {};

// Items that should never visually un-obtain mid-game. The SNES can briefly
// report state 0 (e.g. on save & quit) for things like bombs even though the
// player has clearly already collected them; on the broadcast we want to
// avoid the green-then-flash-off ugliness. Cleared on 'newgame'.
var STICKY_ITEMS = ['bomb'];
var maxState = {};

// Per-element "last applied" caches. We use these to skip DOM writes when
// the current visual state already matches the requested one. Cleared on
// rebuildRows / resetAll so a fresh DOM forces re-application.
var _appliedItemState    = {};   // key (e.g. 'bow') -> last applied numeric state
var _appliedDungeonState = {};   // key -> { chests, max, bigkey, map, compass, smallKeys, maxKeys, prize, obtained, classes }
var _appliedMedallion    = { mm: -1, tr: -1 };
var _appliedGomode       = -1;
var _appliedStats        = { checks: null, deaths: null, bonks: null };

// Snap coalescing — if multiple snap/prizes messages arrive within ~50 ms
// (e.g. during reset or an autotracker burst), only re-render once with the
// latest payload. Caps broadcast view re-render frequency at ~20 Hz.
var _pendingSnap    = null;
var _pendingPrizes  = null;
var _snapTimer      = null;

function applySnapCoalesced(snap) {
  // Merge rather than replace — the item tracker sends two snap messages each
  // cycle (broadcastItemSnap with full dungeon fields, then a slimmer
  // map-focused snap from processInventoryData without Map/Compass/etc.).
  // If we replaced, the slim snap would mask the fresh dungeon state and the
  // broadcast view would never see map/compass changes flip from 0 to 1.
  // Merging preserves fields the slim snap omits.
  _pendingSnap = _pendingSnap ? Object.assign(_pendingSnap, snap) : snap;
  if (_snapTimer) return;
  _snapTimer = setTimeout(_flushSnap, 50);
}
function applyPrizesCoalesced(prizes) {
  _pendingPrizes = prizes;
  if (_snapTimer) return;
  _snapTimer = setTimeout(_flushSnap, 50);
}
function _flushSnap() {
  _snapTimer = null;
  if (_pendingSnap)   { var s = _pendingSnap;   _pendingSnap   = null; applySnap(s); }
  if (_pendingPrizes) { var p = _pendingPrizes; _pendingPrizes = null; applyPrizes(p); }
}

function buildDungeonSlot(key) {
  var slot = document.createElement('div');
  slot.className = 'bdng-slot'
    + (SETTINGS.viewStyle === 'classic' ? ' classic' : '')
    + (SETTINGS.dungeonBoxEnabled ? '' : ' no-box');

  // Label (centered, on its own row)
  var nameEl = document.createElement('div'); nameEl.className = 'bdng-name';
  nameEl.textContent = key.toUpperCase();
  slot.appendChild(nameEl);

  // Prize + big key, centered, under the label
  var top = document.createElement('div'); top.className = 'bdng-top';
  var prizeImg  = document.createElement('img'); prizeImg.className  = 'bdng-prize';      prizeImg.src  = BASE+'/crystal0.png';
  var bigkeyImg = document.createElement('img'); bigkeyImg.className = 'bdng-bigkey-top'; bigkeyImg.src = BASE+'/bigkey0.png';
  top.appendChild(prizeImg); top.appendChild(bigkeyImg);
  slot.appendChild(top);

  // Map / compass, centered
  var icons = document.createElement('div'); icons.className = 'bdng-icons';
  var mapImg     = document.createElement('img'); mapImg.src     = BASE+'/map0.png';
  var compassImg = document.createElement('img'); compassImg.src = BASE+'/compass0.png';
  icons.appendChild(mapImg); icons.appendChild(compassImg);
  slot.appendChild(icons);

  // Small keys row
  var keyRow = document.createElement('div'); keyRow.className = 'bdng-row bdng-keys-row';
  var keyIcon  = document.createElement('img'); keyIcon.src = BASE+'/smallkey0.png';
  var keyVal   = document.createElement('span'); keyVal.className = 'bdng-keys'; keyVal.textContent = '0/0';
  keyRow.appendChild(keyIcon); keyRow.appendChild(keyVal);
  slot.appendChild(keyRow);

  // Chest row
  var chestRow = document.createElement('div'); chestRow.className = 'bdng-row bdng-chests-row';
  var chestIcon = document.createElement('img'); chestIcon.src = BASE+'/chest0.png';
  var chestVal  = document.createElement('span'); chestVal.className = 'bdng-chests'; chestVal.textContent = '0/0';
  chestRow.appendChild(chestIcon); chestRow.appendChild(chestVal);
  slot.appendChild(chestRow);

  dngEls[key] = {
    slot: slot, name: nameEl, prize: prizeImg,
    map: mapImg, bigkey: bigkeyImg, compass: compassImg, iconsRow: icons,
    keyRow: keyRow, keyIcon: keyIcon, keyVal: keyVal,
    chestRow: chestRow, chestIcon: chestIcon, chestVal: chestVal,
    _maxSmallKeys: 0
  };
  return slot;
}

function buildRows() {
  function makeSlot(key, rowEl, isRightColumn) {
    if (isDungeonKey(key)) {
      rowEl.appendChild(buildDungeonSlot(key));
      return;
    }
    if (key === 'bottles') {
      var grid = document.createElement('div'); grid.className = 'bslot-bottles';
      ['bottle1','bottle2','bottle3','bottle4'].forEach(function(bk) {
        var cell = document.createElement('div'); cell.className = 'bminibottle';
        var i = document.createElement('img'); i.src = imgSrc(bk,0);
        slotEls[bk] = i; cell.appendChild(i); grid.appendChild(cell);
      });
      slotContainers['bottles'] = grid;
      rowEl.appendChild(grid); return;
    }
    if (key === 'gomode') {
      // Modern uses the wide right-column slot; Classic uses a regular
      // 40x40 .bslot so the GO button matches the items / dungeons around it.
      var wrap = document.createElement('div');
      wrap.className = (SETTINGS.viewStyle === 'classic') ? 'bslot' : 'bright-slot';
      var btn = document.createElement('div'); btn.className = 'bgo-btn'; btn.textContent = 'GO';
      slotEls['gomode'] = btn; wrap.appendChild(btn); rowEl.appendChild(wrap); return;
    }
    if (key === 'stats') {
      var box = document.createElement('div'); box.className = 'bstats-slot';
      [['check','CHECK','bstat-check'],['death','DEATH','bstat-death'],['bonk','BONKS','bstat-bonk']].forEach(function(t) {
        var row = document.createElement('div'); row.className = 'bstat-row';
        var lbl = document.createElement('span'); lbl.className = 'bstat-label'; lbl.textContent = t[1];
        var val = document.createElement('span'); val.className = t[2]; val.textContent = '0';
        row.appendChild(lbl); row.appendChild(val); box.appendChild(row);
        slotEls['stat_'+t[0]] = val;
      });
      rowEl.appendChild(box); return;
    }
    var slotClass = isRightColumn ? 'bright-slot bslot-icon' : 'bslot';
    var slot = document.createElement('div'); slot.className = slotClass;
    var i = document.createElement('img'); i.src = imgSrc(key,0);
    slot.appendChild(i); slotEls[key] = i;
    slotContainers[key] = slot;
    if (['bombos','ether','quake'].indexOf(key) >= 0) {
      var lbl = document.createElement('div'); lbl.className = 'bmed-label';
      slotEls[key+'_lbl'] = lbl; slot.appendChild(lbl);
    }
    rowEl.appendChild(slot);
  }

  // Render every rowN key the active config provides. Modern has 4 rows
  // (rows 1–3 are items + 1 right-column special, row 4 is the dungeon row).
  // Classic has 5 rows (4 item rows + 1 dungeon row).
  var R = activeRows();
  var container = document.querySelector('.broadcast-container');
  // Strip any rows already in the container — needed for live view-style swap
  container.querySelectorAll('.bcast-row').forEach(function(r) { r.remove(); });

  var rowKeys = Object.keys(R).filter(function(k) { return /^row\d+$/.test(k); })
                              .sort(function(a, b) { return parseInt(a.slice(3)) - parseInt(b.slice(3)); });
  rowKeys.forEach(function(rowKey) {
    var rowEl = document.createElement('div');
    rowEl.className = 'bcast-row';
    rowEl.id = rowKey;
    container.appendChild(rowEl);
    var row = R[rowKey];
    var classic = SETTINGS.viewStyle === 'classic';
    row.forEach(function(k, idx) {
      var lastInRow = idx === row.length - 1;
      // Classic uses a uniform 8-cell grid — no wide right-column slots.
      var isRight = !classic && lastInRow && (k === 'agahnim' || k === 'gomode' || k === 'stats');
      makeSlot(k, rowEl, isRight);
    });
  });
}

// Tear down all rendered slots and rebuild from the active row config. Used
// when the user flips View Style without a full reload.
function rebuildRows() {
  slotEls = {};
  slotContainers = {};
  dngEls = {};
  // Reset the "last applied to DOM" caches — the new DOM starts at defaults
  // so the next snap must actually write through.
  _appliedItemState    = {};
  _appliedDungeonState = {};
  _appliedMedallion    = { mm: -1, tr: -1 };
  _appliedGomode       = -1;
  _appliedStats        = { checks: null, deaths: null, bonks: null };
  // buildRows() removes/rebuilds the .bcast-row elements wholesale
  buildRows();
  applyDungeonVisibility();
  // Re-apply current state to the new DOM
  applySnap(state);
  // And ask the item tracker to resend a fresh snap so prize state is correct
  try { new BroadcastChannel('alttp-tracker').postMessage({ type: 'requestSnap' }); } catch(e) {}
}

// ── Item fill helpers ────────────────────────────────────────────────────
function isFilledFor(key, val) {
  if (!SETTINGS.fillEnabled) return false;
  if (key === 'gomode' || key === 'stats') return false;
  return (val|0) > 0;
}

function applyFill(key, container, isFilled) {
  if (!container) return;
  var was = container.classList.contains('filled');
  if (isFilled === was) return;
  if (isFilled) {
    // Clear existing effect classes, then re-add to retrigger animation
    container.classList.remove('fx-falling', 'fx-fade', 'fx-edges');
    container.classList.add('filled');
    // 'starburst' option uses the uniform fade-in; 'none' uses the edges-in mask.
    if (SETTINGS.fillEffect === 'falling')   void container.offsetWidth, container.classList.add('fx-falling');
    if (SETTINGS.fillEffect === 'starburst') void container.offsetWidth, container.classList.add('fx-fade');
    if (SETTINGS.fillEffect === 'none')      void container.offsetWidth, container.classList.add('fx-edges');
  } else {
    container.classList.remove('filled', 'fx-falling', 'fx-fade', 'fx-edges');
  }
}

function refreshAllFills() {
  // Walk every item key across every row (Classic puts items on row 4 too).
  // Dungeons / gomode / stats are filtered inside the loop.
  var R = activeRows();
  var all = [];
  Object.keys(R).filter(function(k){ return /^row\d+$/.test(k); }).forEach(function(rk){ all = all.concat(R[rk]); });
  all.forEach(function(key) {
    if (key === 'bottles') {
      var anyBottle = ['bottle1','bottle2','bottle3','bottle4'].some(function(b){ return (state[b]||0) > 0; });
      applyFill('bottles', slotContainers['bottles'], isFilledFor('bottles', anyBottle ? 1 : 0));
      return;
    }
    if (key === 'gomode' || key === 'stats') return;
    var c = slotContainers[key]; if (!c) return;
    applyFill(key, c, isFilledFor(key, state[key]||0));
  });
}

function updateItem(key, val) {
  if (key === 'gomode') {
    var btn = slotEls['gomode']; if (!btn) return;
    if (_appliedGomode === val) return;
    _appliedGomode = val;
    btn.className = 'bgo-btn' + (val===1?' on':val===2?' feeling':'');
    btn.style.color = val>0 ? '#000' : '#666';
    return;
  }
  var el = slotEls[key]; if (!el) return;
  state[key] = val;
  // Skip the DOM write if this item is already showing the requested state.
  if (_appliedItemState[key] === val) return;
  _appliedItemState[key] = val;
  el.src = imgSrc(key, val);

  // Update fill state — bottles fill is keyed on the parent
  if (key === 'bottle1' || key === 'bottle2' || key === 'bottle3' || key === 'bottle4') {
    var anyBottle = ['bottle1','bottle2','bottle3','bottle4'].some(function(b){ return (state[b]||0) > 0; });
    applyFill('bottles', slotContainers['bottles'], isFilledFor('bottles', anyBottle ? 1 : 0));
  } else {
    applyFill(key, slotContainers[key], isFilledFor(key, val));
  }
}

function updateMedallions() {
  // Only re-evaluate when one of the two assignments actually changed.
  if (_appliedMedallion.mm === state.mmMedallion && _appliedMedallion.tr === state.trMedallion) return;
  _appliedMedallion.mm = state.mmMedallion;
  _appliedMedallion.tr = state.trMedallion;
  var map = {bombos:1,ether:2,quake:3};
  Object.keys(map).forEach(function(k) {
    var lbl = slotEls[k+'_lbl']; if (!lbl) return;
    var idx = map[k];
    var next = '';
    if (state.mmMedallion===idx && state.trMedallion===idx) next='BOTH';
    else if (state.mmMedallion===idx) next='MM';
    else if (state.trMedallion===idx) next='TR';
    if (lbl.textContent !== next) lbl.textContent = next;
  });
}

function applySnap(snap) {
  Object.keys(snap).forEach(function(k) {
    if (!(k in state)) return;
    var v = snap[k];
    // Sticky items: never decrement once we've seen a higher state this game.
    if (STICKY_ITEMS.indexOf(k) !== -1) {
      var prev = maxState[k] || 0;
      if (v > prev) maxState[k] = v;
      else if (v < prev) v = prev;
    }
    state[k] = v;
  });

  // Walk every item key across every row (Classic puts items on row 4 too).
  var Rs = activeRows();
  var allKeys = [];
  Object.keys(Rs).filter(function(k){ return /^row\d+$/.test(k); }).forEach(function(rk){ allKeys = allKeys.concat(Rs[rk]); });
  allKeys.forEach(function(key) {
    if (key==='bottles') ['bottle1','bottle2','bottle3','bottle4'].forEach(function(bk){updateItem(bk,state[bk]||0);});
    else if (key!=='stats' && key!=='gomode' && !isDungeonKey(key)) updateItem(key,state[key]||0);
  });
  updateItem('gomode', snap.gomode!==undefined ? snap.gomode : state.gomode||0);
  updateMedallions();

  if (snap.checks !== undefined && slotEls['stat_check'] && _appliedStats.checks !== snap.checks) {
    slotEls['stat_check'].textContent = snap.checks; _appliedStats.checks = snap.checks;
  }
  if (snap.deaths !== undefined && slotEls['stat_death'] && _appliedStats.deaths !== snap.deaths) {
    slotEls['stat_death'].textContent = snap.deaths; _appliedStats.deaths = snap.deaths;
  }
  if (snap.bonks  !== undefined && slotEls['stat_bonk']  && _appliedStats.bonks  !== snap.bonks) {
    slotEls['stat_bonk'].textContent  = snap.bonks;  _appliedStats.bonks  = snap.bonks;
  }

  // Dungeons — diff every write against last-applied per-dungeon cache so
  // unchanged values don't touch the DOM at all.
  ROW4.forEach(function(key) {
    var d = dngEls[key]; if (!d) return;
    var cache = _appliedDungeonState[key] || (_appliedDungeonState[key] = {});
    var chests        = snap[key+'Chests'];
    var maxChests     = snap[key+'MaxChests'];
    var bigkey        = snap[key+'BigKey'];
    var mapState      = snap[key+'Map'];
    var compassState  = snap[key+'Compass'];
    var smallKeys     = snap[key+'SmallKeys'];
    var maxSmallKeys  = snap[key+'MaxSmallKeys'];
    var prize         = snap[key+'Prize'];
    var obtained      = snap[key+'PrizeObtained'];

    if (chests !== undefined || maxChests !== undefined) {
      var c = chests    !== undefined ? chests    : (cache.chests || 0);
      var m = maxChests !== undefined ? maxChests : (cache.maxChests || 0);
      if (c !== cache.chests || m !== cache.maxChests) {
        d.chestVal.textContent = c + '/' + m;
        var full = c >= m && m > 0;
        d.chestIcon.src = BASE+'/'+(full?'chest00.png':'chest0.png');
        d.chestVal.classList.toggle('full', full);
        cache.chests = c; cache.maxChests = m; cache.chestsFull = full;
      }
    }
    if (smallKeys !== undefined || maxSmallKeys !== undefined) {
      var sc = smallKeys    !== undefined ? smallKeys    : (cache.smallKeys || 0);
      var sm = maxSmallKeys !== undefined ? maxSmallKeys : (cache.maxSmallKeys || 0);
      // The item tracker's trackerItems.*SmallKeys is a raw SRAM byte and can
      // exceed the dungeon's max in some shuffle modes / save-and-quit cases.
      // Clamp here so the broadcast can never show e.g. "5/3" or "8/3".
      if (sm > 0 && sc > sm) sc = sm;
      // Guard against non-integers slipping through (shouldn't happen, but the
      // 8.5/3 report suggests something occasionally arrives non-clean).
      sc = Math.floor(sc) || 0;
      sm = Math.floor(sm) || 0;
      if (sc !== cache.smallKeys || sm !== cache.maxSmallKeys) {
        d.keyVal.textContent = sc + '/' + sm;
        var sfull = sc >= sm && sm > 0;
        d.keyVal.classList.toggle('full', sfull);
        cache.smallKeys = sc; cache.maxSmallKeys = sm;
        d._maxSmallKeys = sm;
        applyKeyRowDisplay(d);
      }
    }
    if (bigkey       !== undefined && bigkey       !== cache.bigkey)  { d.bigkey.src  = BASE+'/bigkey'  + (bigkey       ? '1' : '0') + '.png'; cache.bigkey  = bigkey; }
    if (mapState     !== undefined && mapState     !== cache.map)     { d.map.src     = BASE+'/map'     + (mapState     ? '1' : '0') + '.png'; cache.map     = mapState; }
    if (compassState !== undefined && compassState !== cache.compass) { d.compass.src = BASE+'/compass' + (compassState ? '1' : '0') + '.png'; cache.compass = compassState; }
    // Update the prize image only if the snap supplied prize info — some snaps
    // (e.g. tracker.js broadcastItems) don't carry prize fields, so we must not
    // wipe out the current image or completion state when they're missing.
    if (prize !== undefined) {
      var prizeSrc = BASE+'/'+prize+(obtained?'1':'0')+'.png';
      if (prize !== cache.prize || !!obtained !== !!cache.obtained) {
        d.prize.src = prizeSrc;
        cache.prize = prize; cache.obtained = !!obtained;
      }
    }

    // Completion state — derive obtained from the prize image src so partial
    // snaps don't flip a green slot back to blue.
    var srcNow   = d.prize.src || '';
    var prizeDone = srcNow.indexOf('1.png') !== -1;
    var allChests = !!cache.chestsFull;
    var fillOn   = SETTINGS.dungeonFillEnabled;
    var wantPrize  = fillOn && allChests && prizeDone;
    var wantChests = fillOn && allChests && !prizeDone;
    if (cache.prizeDoneClass !== wantPrize)   { d.slot.classList.toggle('prize-done',  wantPrize);  cache.prizeDoneClass  = wantPrize; }
    if (cache.chestsDoneClass !== wantChests) { d.slot.classList.toggle('chests-done', wantChests); cache.chestsDoneClass = wantChests; }

    // Pendant accent (subtle border tint when prize collected but chests aren't done)
    var prizeNow  = prize !== undefined ? prize : (
      srcNow.indexOf('greenpendant') !== -1 ? 'greenpendant' :
      srcNow.indexOf('pendant')      !== -1 ? 'pendant' : ''
    );
    var isPendant = prizeNow === 'pendant' || prizeNow === 'greenpendant';
    var wantPendant = isPendant && prizeDone && !allChests;
    if (cache.pendantClass !== wantPendant) { d.slot.classList.toggle('pendant', wantPendant); cache.pendantClass = wantPendant; }
  });

  // Recompute item fills against new state
  refreshAllFills();
}

function resetAll() {
  Object.keys(state).forEach(function(k){state[k]=0;});
  maxState = {};                 // forget sticky items on new game
  // Force every diff guard to "unknown" so resetAll cleanly re-writes every slot.
  _appliedItemState    = {};
  _appliedDungeonState = {};
  _appliedMedallion    = { mm: -1, tr: -1 };
  _appliedGomode       = -1;
  _appliedStats        = { checks: null, deaths: null, bonks: null };
  applySnap(state);
  ['stat_check','stat_death','stat_bonk'].forEach(function(k){if(slotEls[k])slotEls[k].textContent='0';});
  ROW4.forEach(function(k){
    var d=dngEls[k]; if(!d) return;
    d.chestVal.textContent='0/0'; d.keyVal.textContent='0/0';
    d.prize.src=BASE+'/crystal0.png';
    d.bigkey.src=BASE+'/bigkey0.png';
    d.map.src=BASE+'/map0.png';
    d.compass.src=BASE+'/compass0.png';
    d.chestIcon.src=BASE+'/chest0.png';
    d.keyIcon.src=BASE+'/smallkey0.png';
    d.slot.classList.remove('chests-done','prize-done','pendant');
  });
  refreshAllFills();
}

// Apply a "prizes" message — prize-only update, recomputes completion class.
function applyPrizes(prizes) {
  if (!prizes) return;
  Object.keys(prizes).forEach(function(key) {
    var d = dngEls[key]; if (!d) return;
    var p = prizes[key]; if (!p) return;
    var prizeName = p.name || 'crystal';
    var obtained  = !!p.obtained;
    d.prize.src = BASE + '/' + prizeName + (obtained ? '1' : '0') + '.png';

    var parts = d.chestVal.textContent.split('/');
    var cNow  = parseInt(parts[0]) || 0;
    var mNow  = parseInt(parts[1]) || 0;
    var allChests = cNow >= mNow && mNow > 0;
    var fillOn = SETTINGS.dungeonFillEnabled;
    d.slot.classList.toggle('prize-done',  fillOn && allChests && obtained);
    d.slot.classList.toggle('chests-done', fillOn && allChests && !obtained);

    var isPendant = prizeName === 'pendant' || prizeName === 'greenpendant';
    d.slot.classList.toggle('pendant', isPendant && obtained && !allChests);
  });
}

// ── BroadcastChannel ─────────────────────────────────────────────────────
try {
  var bc = new BroadcastChannel('alttp-tracker');
  bc.onmessage = function(e) {
    if (!e.data) return;
    if (e.data.type==='items'||e.data.type==='snap') applySnapCoalesced(e.data.data||e.data);
    else if (e.data.type==='prizes') applyPrizesCoalesced(e.data.data);
    else if (e.data.type==='stats') {
      if(slotEls['stat_check'])slotEls['stat_check'].textContent=e.data.checks||0;
      if(slotEls['stat_death'])slotEls['stat_death'].textContent=e.data.deaths||0;
      if(slotEls['stat_bonk']) slotEls['stat_bonk'].textContent =e.data.bonks ||0;
    }
    else if (e.data.type==='newgame') resetAll();
  };
} catch(err) { console.error('BroadcastChannel error:', err); }

// ── Init ─────────────────────────────────────────────────────────────────
loadSettings();
applyFillVariable();
applyDungeonColors();
buildRows();
applyDungeonVisibility();
applyBg(SETTINGS.bg);
wireSettingsHandlers();

setTimeout(function() {
  try { new BroadcastChannel('alttp-tracker').postMessage({type:'requestSnap'}); } catch(e) {}
}, 500);
</script>
</body>
</html>
